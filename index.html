async function uploadFiles(input,fid,taskId){
  let list=[];try{list=[...(input.files||[])];input.value=''}catch(e){toast('Seçilen dosya okunamadı ('+(e&&e.name||'hata')+').');return}
  if(!list.length){toast('Dosya seçilmedi ya da bu ekran dosya seçmeye izin vermedi.');return}
  let ok=0,fail=0,big=0,lastErr='';
  toast(list.length+' evrak yükleniyor…');
  for(const file of list){
    if(file.size>60*1048576){big++;continue}
    const id=uid();
    let step='okuma';
    try{const buf=await(file.arrayBuffer?file.arrayBuffer():new Response(file).arrayBuffer());step='saklama';await fput(id,{buf,type:file.type||''});
      D.files.push({id,task:taskId||'',folder:taskId?'':fid,name:file.name.slice(0,200)||'evrak',type:file.type||'',size:file.size,added:nowS()});ok++}
    catch(e){fail++;fileOK=false;lastErr='"'+file.name+'" '+step+' sırasında: '+(e&&(e.name||e.message)||'bilinmeyen hata')}
  }
  save();
  if(taskId){if(modalKind==='detail')detail(taskId,true);if(rowEl(taskId))refreshRow(taskId);else render()}else render();
  toast([ok?ok+' evrak yüklendi':'',big?big+' dosya 60 MB\'tan büyük olduğu için alınmadı':'',fail?fail+' evrak kaydedilemedi ('+lastErr+')':''].filter(Boolean).join(' · '));
}
async function fileBlob(f){
  const rec=await fget(f.id);if(!rec)throw new Error('yok');
  return new Blob([rec.buf],{type:rec.type||f.type||'application/octet-stream'});
}
async function openFile(id){
  const f=D.files.find(x=>x.id===id);if(!f)return;
  let blob;try{blob=await fileBlob(f)}catch(e){return toast('Evrak bu cihazda bulunamadı.')}
  const url=URL.createObjectURL(blob);
  if(blob.type.startsWith('image/')){
    openSheet('img',{color:NOTE_C,head:`<h2>${esc(f.name)}</h2>`,body:`<div class="box" style="padding:8px"><img src="${url}" alt="${esc(f.name)}" style="width:100%;height:auto;border-radius:10px;display:block"></div>

    $('#iShare').addEventListener('click',()=>shareFile(f));return;
  }
  const a=document.createElement('a');a.href=url;a.target='_blank';a.rel='noopener';
  if(!blob.type.includes('pdf'))a.download=f.name;
  document.body.appendChild(a);a.click();setTimeout(()=>a.remove(),1000);setTimeout(()=>URL.revokeObjectURL(url),60000);
}
async function shareFile(f){
  try{const blob=await fileBlob(f);const file=new File([blob],f.name,{type:blob.type});
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:f.name});return}
    openFile(f.id);
  }catch(e){if(!(e&&e.name==='AbortError'))toast('Paylaşılamadı.')}
}

const CRC_T=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();

  for(const f of files){

function exportRows(opt){
  let a=visibleTasks();
  if(!opt.done)a=a.filter(t=>t.status!=='done');
  return a.filter(t=>t.title.trim()||t.descr.trim()).map((t,i)=>{
    const n=t.due?diff(t.due):null;
    const status=t.status==='done'?'Tamamlandı'+(t.doneAt?' ('+fmtD(t.doneAt.slice(0,10))+')':''):n!==null&&n<0?(-n)+' gün gecikti':n===0?'Son gün bugün':'Devam ediyor';
    const tone=t.status==='done'?'done':n!==null&&n<0?'late':n===0||(n!==null&&n<=warn())?'soon':'';
    const descLines=[];if(t.descr.trim())descLines.push(...t.descr.trim().split('\n'));
    const subs=opt.subs?t.subs.filter(x=>x.text.trim()).map(x=>(x.done?'☑ ':'☐ ')+x.text.trim()):[];
    const notes=opt.notes?[...t.notes].sort((a,b)=>(a.at||'').localeCompare(b.at||'')).map(x=>fmtT(x.at)+' – '+x.text.replace(/\n/g,' ')):[];
    const files=taskFiles(t.id).map(f=>f.name);
    return {no:i+1,title:(t.prio!=='normal'?(t.prio==='acil'?'[ACİL] ':'[ÖNCELİKLİ] '):'')+(t.title.trim()||'Başlıksız iş'),groups:t.groups.length?t.groups.map(gName).join(', '):'Genel',
      desc:descLines,subs,subProg:t.subs.length?t.subs.filter(x=>x.done).length+'/'+t.subs.length:'',notes,files,ref:t.ref,
      staff:t.staff.map(sName).join(', ')||'—',due:t.due?fmtD(t.due):'—',follow:t.follow&&t.status!=='done'?fmtD(t.follow):'—',status,tone};
  });
}
function exportTitle(){
  const o=ctx.o;let t=o.kind==='group'?gName(o.id):o.kind==='staff'?sName(o.id):($('#screen .ghead h1')||{}).textContent||'İşler';
  const extra=[];if(staffF==='-')extra.push('Personel atanmamış işler');else if(staffF)extra.push('Personel: '+sName(staffF));if(q.trim())extra.push('Arama: "'+q.trim()+'"');

  rows.forEach((r,ix)=>{
    const fill=r.tone==='done'?'E8F7EE':ix%2?'F6F7F9':'';
    const d=[...r.desc.map(l=>para(run(l))),...r.subs.map(s=>para(run(s,{c:s.startsWith('☑')?'15803D':'111111'}))),
      ...(r.notes.length?[para(run('Yapılan işlemler:',{b:true,sz:16,c:'555555'})),...r.notes.map(n=>para(run(n,{sz:16,c:'444444'})))]:[]),

  });

  const body=para(run(head.title,{b:true,sz:32}),{after:60})+para(run(head.sub,{sz:18,c:'555555'}),{after:200})+

function buildPdf(rows,head,opt){
  const W=841.89,H=595.28,M=30,FS=8.6,LH=11.2,PAD=4;
  const fonts={r:PDFFONTS.r,b:PDFFONTS.b};
  const glyph=(f,ch)=>fonts[f].map[ch.codePointAt(0)]||fonts[f].map[63];
  const tw=(s,f,sz)=>{let w=0;for(const ch of s)w+=glyph(f,ch)[1];return w*sz/1000};
  const hex=(s,f)=>{let o='';for(const ch of s)o+=glyph(f,ch)[0].toString(16).padStart(4,'0');return o};
  const used={r:new Set(),b:new Set()};
  const wrap=(text,f,sz,maxW)=>{const out=[];for(const para of String(text).split('\n')){let line='';
      for(const word of para.split(/\s+/).filter(Boolean)){const tryL=line?line+' '+word:word;
        if(tw(tryL,f,sz)<=maxW){line=tryL;continue}
        if(line)out.push(line);
        if(tw(word,f,sz)>maxW){let part='';for(const ch of word){if(tw(part+ch,f,sz)>maxW){out.push(part);part=ch}else part+=ch}line=part}else line=word}
      out.push(line)}return out};
  const cols=[{h:'No',w:24},{h:'İş',w:165},{h:'Açıklama'+(opt.subs?' / alt işler':'')+(opt.notes?' / işlemler':''),w:252},{h:'Personel',w:100},{h:'Son gün',w:58},{h:'Takip',w:58},{h:'Durum',w:W-2*M-24-165-252-100-58-58}];
  const pages=[];let ops,y;
  const col=(r,g,b)=>`${(r/255).toFixed(3)} ${(g/255).toFixed(3)} ${(b/255).toFixed(3)}`;
  const text=(x,yy,s,f,sz,c='0 0 0')=>{for(const ch of s)used[f].add(ch.codePointAt(0));ops.push(`BT ${c} rg /F${f==='b'?2:1} ${sz} Tf ${x.toFixed(2)} ${yy.toFixed(2)} Td <${hex(s,f)}> Tj ET`)};
  const rect=(x,yy,w,h,fill)=>ops.push(`${fill} rg ${x.toFixed(2)} ${yy.toFixed(2)} ${w.toFixed(2)} ${h.toFixed(2)} re f`);
  const line=(x1,y1,x2,y2)=>ops.push(`${col(203,213,225)} RG 0.5 w ${x1.toFixed(2)} ${y1.toFixed(2)} m ${x2.toFixed(2)} ${y2.toFixed(2)} l S`);
  const headerRow=()=>{const h=18;rect(M,y-h,W-2*M,h,col(31,41,55));let x=M;for(const c of cols){text(x+PAD,y-12.5,c.h,'b',8,'1 1 1');x+=c.w}y-=h};
  const newPage=first=>{ops=[];pages.push(ops);y=H-M;
    if(first){text(M,y-16,head.title,'b',16);y-=24;text(M,y-9,head.sub,'r',8.5,col(85,85,85));y-=20}
    else{text(M,y-9,head.title+' (devamı)','b',9,col(85,85,85));y-=16}
    headerRow()};
  newPage(true);
  rows.forEach((r,ix)=>{
    const cellsTxt=[
      [{t:String(r.no),f:'r'}],
      [{t:r.title,f:'b'},...(head.showGroups?[{t:r.groups,f:'r',c:col(102,102,102),sz:7.6}]:[]),...(r.subProg?[{t:'Alt işler: '+r.subProg,f:'r',c:col(102,102,102),sz:7.6}]:[])],
      [...r.desc.map(l=>({t:l,f:'r'})),...r.subs.map(s=>({t:s,f:'r',c:s.startsWith('☑')?col(21,128,61):'0 0 0'})),
       ...(r.notes.length?[{t:'Yapılan işlemler:',f:'b',sz:7.6,c:col(85,85,85)},...r.notes.map(n=>({t:n,f:'r',sz:7.6,c:col(68,68,68)}))]:[]),
       ...(r.files.length?[{t:'Belgeler: '+r.files.join(', '),f:'r',sz:7.6,c:col(85,85,85)}]:[]),...(r.ref?[{t:'Evrak: '+r.ref,f:'r',sz:7.6,c:col(85,85,85)}]:[])],
      [{t:r.staff,f:'r'}],[{t:r.due,f:'r'}],[{t:r.follow,f:'r'}],
      [{t:r.status,f:'b',c:r.tone==='late'?col(200,30,30):r.tone==='done'?col(21,128,61):r.tone==='soon'?col(180,83,9):'0 0 0'}]];
    const laid=cellsTxt.map((items,i)=>items.flatMap(it=>wrap(it.t,it.f,it.sz||FS,cols[i].w-2*PAD).map(l=>({...it,t:l}))));
    const lines=Math.max(1,...laid.map(c=>c.length));const rh=lines*LH+2*PAD-1;
    if(y-rh<M+16){newPage(false)}
    const fill=r.tone==='done'?col(232,247,238):ix%2?col(246,247,249):null;
    if(fill)rect(M,y-rh,W-2*M,rh,fill);
    let x=M;laid.forEach((c,i)=>{c.forEach((it,k)=>text(x+PAD,y-PAD-8-k*LH,it.t,it.f,it.sz||FS,it.c||'0 0 0'));x+=cols[i].w});
    x=M;for(const c of cols){line(x,y,x,y-rh);x+=c.w}line(W-M,y,W-M,y-rh);line(M,y-rh,W-M,y-rh);
    y-=rh;
  });
  if(!rows.length)text(M,y-16,'Bu listede iş yok.','r',10,col(102,102,102));
  // alt bilgi
  pages.forEach((p,i)=>{ops=p;const s='Sayfa '+(i+1)+' / '+pages.length;text(W-M-tw(s,'r',7.5),M-14,s,'r',7.5,col(120,120,120));text(M,M-14,'İş Takip · '+fmtT(nowS()),'r',7.5,col(120,120,120))});
  // ---- PDF nesneleri ----
  const objs=[];const add=body=>{objs.push(body);return objs.length};
  const b64=s=>{const bin=atob(s),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u};
  const fontObj=(k,name)=>{const F=fonts[k],ff=b64(F.b64);
    const file=add({dict:`<</Length ${ff.length} /Length1 ${ff.length}>>`,stream:ff});
    const desc=add(`<</Type/FontDescriptor/FontName/${name}/Flags 32/FontBBox[${F.bbox.join(' ')}]/ItalicAngle 0/Ascent ${F.asc}/Descent ${F.desc}/CapHeight ${F.cap}/StemV 80/FontFile2 ${file} 0 R>>`);
    const ws=Object.values(F.map).sort((a,b)=>a[0]-b[0]).map(([g,w])=>`${g}[${w}]`).join(' ');
    const cid=add(`<</Type/Font/Subtype/CIDFontType2/BaseFont/${name}/CIDSystemInfo<</Registry(Adobe)/Ordering(Identity)/Supplement 0>>/FontDescriptor ${desc} 0 R/W[${ws}]/DW 600/CIDToGIDMap/Identity>>`);
    const bf=Object.entries(F.map).map(([cp,[g]])=>`<${g.toString(16).padStart(4,'0')}><${(+cp).toString(16).padStart(4,'0')}>`);
    let cm='/CIDInit/ProcSet findresource begin 12 dict begin begincmap/CIDSystemInfo<</Registry(Adobe)/Ordering(UCS)/Supplement 0>>def/CMapName/Adobe-Identity-UCS def/CMapType 2 def 1 begincodespacerange<0000><FFFF>endcodespacerange\n';
    for(let i=0;i<bf.length;i+=100){const ch=bf.slice(i,i+100);cm+=`${ch.length} beginbfchar\n${ch.join('\n')}\nendbfchar\n`}
    cm+='endcmap CMapName currentdict/CMap defineresource pop end end';
    const tu=add({dict:`<</Length ${enc.encode(cm).length}>>`,stream:enc.encode(cm)});
    return add(`<</Type/Font/Subtype/Type0/BaseFont/${name}/Encoding/Identity-H/DescendantFonts[${cid} 0 R]/ToUnicode ${tu} 0 R>>`)};
  const f1=fontObj('r','AAAAAA+DejaVuSans'),f2=fontObj('b','AAAAAB+DejaVuSans-Bold');
  const pagesId=objs.length+1;objs.push(null);
  const kids=pages.map(p=>{const c=enc.encode(p.join('\n'));const cId=add({dict:`<</Length ${c.length}>>`,stream:c});
    return add(`<</Type/Page/Parent ${pagesId} 0 R/MediaBox[0 0 ${W} ${H}]/Resources<</Font<</F1 ${f1} 0 R/F2 ${f2} 0 R>>>>/Contents ${cId} 0 R>>`)});
  objs[pagesId-1]=`<</Type/Pages/Kids[${kids.map(k=>k+' 0 R').join(' ')}]/Count ${kids.length}>>`;
  const info=add(`<</Title<FEFF${[...head.title].map(c=>c.charCodeAt(0).toString(16).padStart(4,'0')).join('')}>/Producer(Is Takip)>>`);
  const cat=add(`<</Type/Catalog/Pages ${pagesId} 0 R>>`);
  const chunks=[enc.encode('%PDF-1.7\n%âãÏÓ\n')];let pos=chunks[0].length;const offs=[];
  objs.forEach((o,i)=>{offs.push(pos);const parts=typeof o==='string'?[enc.encode(`${i+1} 0 obj\n${o}\nendobj\n`)]:[enc.encode(`${i+1} 0 obj\n${o.dict}\nstream\n`),o.stream,enc.encode('\nendstream\nendobj\n')];
    parts.forEach(p=>{chunks.push(p);pos+=p.length})});
  const xref=`xref\n0 ${objs.length+1}\n0000000000 65535 f \n${offs.map(o=>String(o).padStart(10,'0')+' 00000 n \n').join('')}trailer\n<</Size ${objs.length+1}/Root ${cat} 0 R/Info ${info} 0 R>>\nstartxref\n${pos}\n%%EOF`;
  chunks.push(enc.encode(xref));
  return new Blob(chunks,{type:'application/pdf'});
}

/* ---- dosyayı kullanıcıya ver ---- */
async function deliverFile(blob,name,mime){
  if(DENEME&&window.claude&&window.claude.use){
    try{const dl=await window.claude.use('downloads');if(dl){await dl.save({filename:name,data:blob});return 'ok'}}
    catch(e){if(e&&e.code==='declined')return 'declined';}
  }
  try{const file=new File([blob],name,{type:mime});
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name});return 'ok'}}
  catch(e){if(e&&e.name==='AbortError')return 'declined'}
  try{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},4000);return 'ok'}catch(e){return 'fail'}
}
function exportSheet(){
  const {title,extra}=exportTitle();
  const anyDone=visibleTasks().some(t=>t.status==='done');
  openSheet('export',{color:'#334155',head:`<div class="sub">${esc(title)}${extra?' · '+esc(extra):''}</div><h2>Tabloyu indir</h2>`,
    body:`<div class="box"><span class="lbl">Biçim</span><div class="chips" id="xFmt"><button class="chip on" data-x="pdf" style="--c:#dc2626">PDF</button><button class="chip" data-x="docx" style="--c:#2563eb">Word (.docx)</button></div>
      <span class="lbl" style="margin-top:16px">İçerik</span>
      <label class="xopt"><input type="checkbox" id="xDone" ${anyDone&&!hideDone?'checked':''}> Tamamlanan işleri de ekle</label>
      <label class="xopt"><input type="checkbox" id="xSubs" checked> Alt işleri ekle</label>
      <label class="xopt"><input type="checkbox" id="xNotes"> Yapılan işlemleri (notları) ekle</label>
      <p class="hint">Ekranda gördüğünüz liste (arama ve personel filtresi dahil) yatay A4 sayfaya tablo olarak aktarılır.</p></div>
      <div class="err" id="xErr"></div>
      <div class="acts"><span class="grow"></span><button class="btn" data-close>Vazgeç</button><button class="btn pri" id="xGo" style="--c:#334155">${ic('save','style="width:20px;height:20px;vertical-align:-4px"')} İndir</button></div>`});
  let fmt='pdf';
  $('#xFmt').addEventListener('click',e=>{const b=e.target.closest('[data-x]');if(!b)return;fmt=b.dataset.x;$('#xFmt').querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',x===b))});
  $('#xGo').addEventListener('click',async()=>{
    flushSave();
    const opt={done:$('#xDone').checked,subs:$('#xSubs').checked,notes:$('#xNotes').checked};
    const rows=exportRows(opt);
    const open=rows.filter(r=>r.tone!=='done').length,late=rows.filter(r=>r.tone==='late').length;
    const head={title,showGroups:!['group','genel'].includes(ctx.o.kind),sub:[new Date().toLocaleDateString('tr-TR',{day:'numeric',month:'long',year:'numeric'}),rows.length+' iş',open+' açık',late?late+' gecikmiş':'',extra].filter(Boolean).join(' · ')};
    const base=safeName(title)+'_'+todayS();
    $('#xGo').disabled=true;
    try{
      const blob=fmt==='pdf'?buildPdf(rows,head,opt):buildDocx(rows,head,opt);
      const r=await deliverFile(blob,base+'.'+fmt,fmt==='pdf'?'application/pdf':'application/vnd.openxmlformats-officedocument.wordprocessingml.document');
      if(r==='ok'){closeModal(true);toast((fmt==='pdf'?'PDF':'Word dosyası')+' hazırlandı')}
      else if(r==='declined'){$('#xGo').disabled=false}
      else{$('#xErr').textContent='Dosya kaydedilemedi.';$('#xGo').disabled=false}
    }catch(e){console.error(e);$('#xErr').textContent='Dosya oluşturulamadı.';$('#xGo').disabled=false}
  });
}

function groupForm(g){

    body:`<div class="box"><label class="lbl" for="gN">Grup başkanlığı adı</label><input class="inp" id="gN" value="${esc(g.name)}">
      <span class="lbl" style="margin-top:14px">Renk</span><div class="swatches" id="gC">${COLORS.map(c=>`<button type="button" data-c="${c}" style="--c:${c}" class="${c===color?'on':''}" aria-label="Renk"></button>`).join('')}</div>
      <label class="lbl" for="gK" style="margin-top:14px">Anahtar kelimeler</label><input class="inp" id="gK" value="${esc(g.keywords)}" placeholder="Örn. bütçe, ödenek, tertip">

  $('#gC').addEventListener('click',e=>{const b=e.target.closest('[data-c]');if(!b)return;color=b.dataset.c;$('#gC').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));$('#sheet').style.setProperty('--c',color)});

    if(!b.dataset.sure){b.dataset.sure=1;b.textContent='Silinsin mi? İşleri Genel\'e geçer';return}
    D.groups=D.groups.filter(x=>x.id!==g.id);D.tasks.forEach(t=>t.groups=t.groups.filter(x=>x!==g.id));D.staff.forEach(s=>{if(s.group===g.id)s.group=''});
    if(save()){closeModal();render();toast('Grup silindi')}});
}
function staffForm(s,presetGroup){
  const isNew=!s;s=s||{name:'',title:'',group:presetGroup||''};
  openSheet('staff',{color:s.group?gColor(s.group):null,light:!s.group,head:`<h2>${isNew?'Personel ekle':'Personeli düzenle'}</h2>`,
    body:`<div class="box"><label class="lbl" for="sN">Ad soyad</label><input class="inp" id="sN" value="${esc(s.name)}">
      <label class="lbl" for="sT" style="margin-top:14px">Unvan</label><input class="inp" id="sT" value="${esc(s.title)}" placeholder="Örn. Şube Müdürü, Uzman">
      <span class="lbl" style="margin-top:14px">Grup başkanlığı</span><div class="chips" id="sG">${D.groups.map(g=>`<button type="button" class="chip ${s.group===g.id?'on':''}" data-g="${esc(g.id)}" style="--c:${g.color}"><i class="sw"></i>${esc(g.name)}</button>`).join('')}<button type="button" class="chip ${!s.group?'on':''}" data-g="" style="--c:${GENEL_C}">Yok</button></div></div>
      <div class="err" id="sErr"></div>
      <div class="acts">${isNew?'':'<button class="btn danger" id="sDel">Sil</button>'}<span class="grow"></span><button class="btn" data-close>Vazgeç</button><button class="btn pri" id="sSave">Kaydet</button></div>`});
  let grp=s.group;
  $('#sG').addEventListener('click',e=>{const b=e.target.closest('[data-g]');if(!b)return;grp=b.dataset.g;$('#sG').querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',x===b))});
  $('#sSave').addEventListener('click',()=>{const n=$('#sN').value.trim();if(!n){$('#sErr').textContent='Ad soyad yazın.';return}
    const v={name:n.slice(0,120),title:$('#sT').value.trim().slice(0,120),group:grp};
    if(isNew)D.staff.push({id:uid(),...v});else Object.assign(S(s.id),v);
    D.staff.sort((a,b)=>a.name.localeCompare(b.name,'tr'));
    if(save()){closeModal();render();toast('Personel kaydedildi')}});
  $('#sDel')?.addEventListener('click',e=>{const b=e.currentTarget;
    if(!b.dataset.sure){b.dataset.sure=1;b.textContent='Silinsin mi?';return}
    D.staff=D.staff.filter(x=>x.id!==s.id);D.tasks.forEach(t=>t.staff=t.staff.filter(x=>x!==s.id));
    if(save()){closeModal();render();toast('Personel silindi')}});
}

/* ================= yedek ================= */
const toB64=blob=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]||'');r.onerror=()=>rej(r.error);r.readAsDataURL(blob)});
const fromB64=b=>{const s=atob(b),u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u.buffer};
async function exportData(){
  const stamp=nowS();
  const dosyalar={};let miss=0;
  if(D.files.length)toast('Yedek hazırlanıyor…');
  for(const f of D.files){try{const rec=await fget(f.id);if(rec)dosyalar[f.id]={type:rec.type||'',b64:await toB64(new Blob([rec.buf]))};else miss++}catch(e){miss++}}
  const body=JSON.stringify({uygulama:'daire-is-takip',surum:3,alindi:stamp,veri:{...D,lastBackup:stamp},dosyalar});
  const name='is-takip-yedek-'+todayS()+'.json';
  let ok=false;
  try{const file=new File([body],name,{type:'application/json'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'İş Takip yedeği'});ok=true}}
  catch(e){if(e&&e.name==='AbortError')return}
  if(!ok){try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([body],{type:'application/json'}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000);ok=true}catch(e){}}
  if(ok){D.lastBackup=stamp;save();render();toast('Yedek hazırlandı: '+name)}else toast('Yedek dosyası oluşturulamadı.');
}
function importData(e){
  const file=e.target.files&&e.target.files[0];e.target.value='';if(!file)return;
  const rd=new FileReader();
  rd.onload=()=>{
    let p;try{p=JSON.parse(rd.result)}catch(x){return toast('Bu dosya geçerli bir yedek değil.')}
    if(!p||p.uygulama!=='daire-is-takip'||!p.veri)return toast('Bu dosya İş Takip yedeği değil.');
    const nd=normalize(p.veri);
    openSheet('import',{head:`<h2>Yedekten geri yükle</h2>`,
      body:`<div class="box">Yedek tarihi: <b>${esc(fmtT(p.alindi||''))}</b><br>${nd.tasks.length} iş · ${nd.groups.length} grup · ${nd.staff.length} personel · ${nd.files.length} evrak</div>
        <p style="color:var(--red);font-weight:600">Bu cihazdaki mevcut kayıtların (${D.tasks.length} iş) yerini alacak.</p>
        <div class="acts"><span class="grow"></span><button class="btn" data-close>Vazgeç</button><button class="btn pri" id="imOk">Geri yükle</button></div>`});
    $('#imOk').addEventListener('click',async()=>{
      $('#imOk').disabled=true;
      try{if(p.dosyalar&&typeof p.dosyalar==='object'){await fclear();
        for(const f of nd.files){const r=p.dosyalar[f.id];if(r&&typeof r.b64==='string')await fput(f.id,{buf:fromB64(r.b64),type:String(r.type||'')})}}}
      catch(e){toast('Evraklar geri yüklenemedi; iş kayıtları yüklendi.')}
      D=nd;if(save()){closeModal(true);go('ana');toast('Yedek geri yüklendi')}});
  };
  rd.readAsText(file);
}

/* ================= ilk açılış ================= */
function welcome(){
  openSheet('welcome',{color:'#2563eb',head:`<h2>Hoş geldiniz</h2><div class="sub">Kayıtlarınız yalnızca bu cihazda saklanır. Hesap ya da internet gerekmez.</div>`,
    body:`<div class="box"><label class="lbl" for="wG">Grup başkanlıklarınız (her satıra bir tane)</label><textarea class="inp" id="wG" rows="5">1. Grup Başkanlığı
2. Grup Başkanlığı
3. Grup Başkanlığı
4. Grup Başkanlığı</textarea>
      <div class="hint">Renk, anahtar kelime ve personeli sonra Ayarlar'dan eklersiniz.</div></div>
      <div class="acts">${DENEME?'':'<label class="btn filebtn">Yedekten geri yükle<input type="file" id="wIn" accept=".json,application/json"></label>'}<span class="grow"></span><button class="btn pri" id="wOk">Başla</button></div>`});
  $('#sheet .x').remove();
  $('#wIn')?.addEventListener('change',importData);
  $('#wOk').addEventListener('click',()=>{
    const names=$('#wG').value.split('\n').map(s=>s.trim()).filter(Boolean);
    D.groups=(names.length?names:['Grup Başkanlığı']).map((n,i)=>({id:uid(),name:n.slice(0,120),keywords:'',color:COLORS[i%COLORS.length]}));
    save();closeModal(true);render();
  });
}

/* ================= başlat ================= */
render();
if(firstRun)welcome();
if(D.settings.pin)lockNow();
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!modalKind)render()});
setInterval(()=>{if(!document.hidden&&!modalKind&&!document.activeElement.matches('input,textarea'))render()},60000);
if(!DENEME&&'serviceWorker' in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('sw.js').catch(()=>{});
}
