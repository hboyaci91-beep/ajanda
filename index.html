<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f3f4f7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="İş Takip">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>İş Takip</title>
<style>
/* VOICE: sakin, güven veren, dokunmaya davet eden bir tablet uygulaması
   IDEA: masadaki renkli dosya klasörleri — her grup başkanlığı kendi renginde bir klasör
   PICTURE: ana ekranda büyük renkli grup kartları; içeride kartlar halinde işler
   COLOUR and TYPE: açık gri zemin, beyaz kartlar, her gruba bir renk; kırmızı gecikme, turuncu yaklaşan; sistem yazısı
   LAYOUT: üstte selam ve özet, altında grup kartları ızgarası; grup ekranında renkli başlık, iş kartları, yüzen "İş ekle" */
:root{--bg:#f3f4f7;--card:#fff;--ink:#14161b;--mute:#6b7280;--line:#e6e8ec;--soft:#f6f7f9;
  --red:#dc2626;--redbg:#fde8e8;--orange:#c2410c;--orangebg:#ffedd5;--green:#15803d;--greenbg:#dcfce7;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 6px 20px rgba(16,24,40,.07);--shadow2:0 10px 40px rgba(16,24,40,.22);color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0f1115;--card:#1a1d24;--ink:#f1f3f6;--mute:#9aa3af;--line:#2a2f39;--soft:#222630;
  --red:#f87171;--redbg:#3a1d1f;--orange:#fb923c;--orangebg:#3a2716;--green:#4ade80;--greenbg:#16301f;--shadow:0 1px 2px rgba(0,0,0,.4);--shadow2:0 10px 40px rgba(0,0,0,.6);color-scheme:dark}}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:17px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;overflow-x:clip;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:3px solid #2563eb;outline-offset:2px}
.hide{display:none!important}
.wrap{max-width:1100px;margin:0 auto;padding:0 clamp(16px,3.5vw,32px) 120px}
svg.i{width:22px;height:22px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ---- üst çubuk ---- */
.bar{display:flex;align-items:center;gap:12px;padding:22px 0 8px}
.bar h1{font-size:clamp(26px,4vw,34px);line-height:1.1;margin:0;font-weight:750;letter-spacing:-.02em}
.bar .date{color:var(--mute);font-size:16px;margin-top:4px}
.bar .grow{flex:1}
.iconbtn{width:48px;height:48px;border-radius:14px;background:var(--card);box-shadow:var(--shadow);display:grid;place-items:center;color:var(--ink)}
.search{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:0 16px;margin:14px 0 4px;min-height:52px;color:var(--mute)}
.search input{flex:1;border:0;background:none;min-height:50px;font-size:17px;color:var(--ink);outline:none}

/* ---- özet kartları ---- */
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:16px 0 6px}
.stat{background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:16px 18px;text-align:left;display:flex;flex-direction:column;gap:2px;min-height:104px}
.stat b{font-size:clamp(30px,5vw,40px);line-height:1;font-weight:750}
.stat span{color:var(--mute);font-size:15px}
.stat .dot{width:10px;height:10px;border-radius:50%;margin-bottom:10px}
.stat.r b{color:var(--red)}.stat.r .dot{background:var(--red)}
.stat.o b{color:var(--orange)}.stat.o .dot{background:var(--orange)}
.stat.b .dot{background:#2563eb}
.stat.zero b{color:var(--mute)}

h2.sec{font-size:20px;font-weight:700;margin:26px 0 12px;display:flex;align-items:baseline;gap:10px}
h2.sec small{font-size:15px;color:var(--mute);font-weight:500}

/* ---- grup kartları ---- */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.tile{background:var(--card);border-radius:22px;box-shadow:var(--shadow);overflow:hidden;text-align:left;display:flex;flex-direction:column;transition:transform .15s}
.tile:active{transform:scale(.98)}
.tile .head{background:var(--c);color:#fff;padding:18px 18px 16px;display:flex;align-items:flex-start;justify-content:space-between;gap:10px;min-height:112px;position:relative;overflow:hidden}
.tile .head::after{content:"";position:absolute;right:-30px;bottom:-50px;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.12)}
.tile .head .num{font-size:46px;font-weight:750;line-height:1}
.tile .head .num small{display:block;font-size:14px;font-weight:600;opacity:.9;margin-top:4px}
.tile .ico{width:44px;height:44px;border-radius:12px;background:rgba(255,255,255,.2);display:grid;place-items:center}
.tile .body{padding:14px 18px 16px;display:flex;flex-direction:column;gap:8px;flex:1}
.tile .name{font-size:18px;font-weight:700;line-height:1.25}
.badges{display:flex;flex-wrap:wrap;gap:6px}
.badge{font-size:13px;font-weight:650;padding:3px 10px;border-radius:20px;white-space:nowrap}
.badge.r{background:var(--redbg);color:var(--red)}.badge.o{background:var(--orangebg);color:var(--orange)}.badge.g{background:var(--greenbg);color:var(--green)}
.badge.n{background:var(--soft);color:var(--mute)}
.next{font-size:14px;color:var(--mute);border-top:1px solid var(--line);padding-top:10px;margin-top:auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.next b{color:var(--ink);font-weight:600}
.links{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin-top:16px}
.link{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:16px 18px;display:flex;align-items:center;gap:14px;text-align:left;min-height:64px;font-weight:600}
.link .ico2{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--soft);color:var(--mute)}
.link .grow{flex:1}.link small{display:block;color:var(--mute);font-weight:500;font-size:14px}
.note{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:14px 16px;margin-top:14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:15px;color:var(--mute)}
.note .grow{flex:1 1 220px}
.note.warn{border-left:5px solid var(--orange)}

/* ---- grup ekranı ---- */
.ghead{background:var(--c);color:#fff;border-radius:0 0 28px 28px;margin:0 calc(-1*clamp(16px,3.5vw,32px));padding:18px clamp(16px,3.5vw,32px) 22px;position:relative;overflow:hidden;overflow:clip}
.ghead::after{content:"";position:absolute;right:-60px;top:-60px;width:240px;height:240px;border-radius:50%;background:rgba(255,255,255,.1)}
.back{display:inline-flex;align-items:center;gap:4px;min-height:44px;padding:0 14px 0 8px;border-radius:22px;background:rgba(255,255,255,.2);color:inherit;font-weight:600;font-size:16px}
.ghead h1{font-size:clamp(26px,4.5vw,36px);margin:16px 0 6px;font-weight:750;letter-spacing:-.02em;line-height:1.1;position:relative}
.ghead .sub{opacity:.92;font-size:16px;position:relative}
.ghead .badges{margin-top:12px;position:relative}
.ghead .badge{background:rgba(255,255,255,.22);color:#fff}
.plain .ghead{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.plain .back{background:var(--soft)}
.plain .ghead .badge{background:var(--soft);color:var(--ink)}
.seg{display:inline-flex;background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:4px;margin:18px 0 14px;gap:4px}
.seg button{min-height:42px;padding:0 18px;border-radius:10px;font-weight:600;color:var(--mute);font-size:16px}
.seg button.on{background:var(--ink);color:var(--bg)}
.tools{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.tools .search{flex:1 1 260px;margin:0}

/* ---- iş kartları ---- */
.tasks{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.tcard{display:flex;align-items:stretch;background:var(--card);border-radius:18px;box-shadow:var(--shadow);overflow:hidden;border-left:6px solid var(--line)}
.tcard.late{border-left-color:var(--red)}.tcard.soon{border-left-color:var(--orange)}.tcard.done{opacity:.72}
.chk{width:62px;display:grid;place-items:center;flex:none}
.chk span{width:30px;height:30px;border-radius:50%;border:2.5px solid #c5cad3;display:grid;place-items:center;color:transparent;transition:.15s}
.chk:hover span{border-color:var(--green)}
.tcard.done .chk span{background:var(--green);border-color:var(--green);color:#fff}
.tmain{flex:1;text-align:left;padding:14px 16px 14px 0;display:flex;flex-direction:column;gap:7px}
.ttl{font-size:17px;font-weight:650;line-height:1.3}
.tcard.done .ttl{text-decoration:line-through;color:var(--mute)}
.tmeta{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;font-size:14px;color:var(--mute)}
.gchip{font-size:13px;font-weight:650;padding:2px 9px;border-radius:8px;background:color-mix(in srgb,var(--c) 14%,transparent);color:var(--c)}
.prio{font-size:12px;font-weight:750;padding:2px 8px;border-radius:6px;background:var(--red);color:#fff;margin-right:6px;vertical-align:2px}
.prio.yuksek{background:var(--orange)}
.avs{display:inline-flex}
.av{width:26px;height:26px;border-radius:50%;background:var(--c,#64748b);color:#fff;font-size:11px;font-weight:700;display:inline-grid;place-items:center;border:2px solid var(--card);margin-left:-6px}
.av:first-child{margin-left:0}
.inl{display:inline-flex;align-items:center;gap:4px}
.inl svg.i{width:16px;height:16px}
.chev{display:grid;place-items:center;padding-right:14px;color:#b6bcc6}
.empty{background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:36px 20px;text-align:center;color:var(--mute)}
.empty b{display:block;color:var(--ink);font-size:18px;margin-bottom:4px}

/* ---- yüzen düğme ---- */
.fab{position:fixed;right:max(20px,env(safe-area-inset-right));bottom:max(22px,env(safe-area-inset-bottom));z-index:15;display:inline-flex;align-items:center;gap:8px;min-height:60px;padding:0 24px 0 18px;border-radius:30px;background:var(--c,#2563eb);color:#fff;font-weight:700;font-size:18px;box-shadow:var(--shadow2)}
.fab svg.i{width:26px;height:26px;stroke-width:2.5}

/* ---- sayfa (sheet) ---- */
.modal{position:fixed;inset:0;background:rgba(15,17,21,.45);z-index:30;display:flex;flex-direction:column;align-items:center;overflow-y:auto;-webkit-overflow-scrolling:touch}
.modal>.sheet{margin-top:auto;flex:none}
@media(min-width:700px){.modal{padding:5vh 16px}.modal>.sheet{margin-top:0}}
.sheet{background:var(--bg);width:100%;max-width:640px;border-radius:26px 26px 0 0;box-shadow:var(--shadow2);position:relative;overflow:hidden}
@media(min-width:700px){.sheet{border-radius:26px}}
.shead{background:var(--c,var(--card));color:var(--hc,var(--ink));padding:20px 22px 18px;position:relative}
.shead h2{margin:0;font-size:24px;line-height:1.2;font-weight:750;padding-right:48px}
.shead .sub{opacity:.9;font-size:15px;margin-top:4px}
.x{position:absolute;z-index:3;top:12px;right:12px;width:44px;height:44px;border-radius:50%;background:rgba(127,127,127,.18);color:inherit;font-size:24px;line-height:1;display:grid;place-items:center}
.sbody{padding:6px 22px 24px}
.box{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:14px 16px;margin-top:14px}
.lbl{display:block;font-size:14px;font-weight:650;color:var(--mute);margin:0 0 8px}
.inp{width:100%;min-height:50px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);padding:12px 14px;font-size:17px;color:var(--ink)}
textarea.inp{min-height:92px;resize:vertical}
#dT,#pT{min-height:50px}
.inp:focus{border-color:var(--c,#2563eb);outline:none}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:0 16px;border-radius:22px;border:1.5px solid var(--line);background:var(--card);font-size:16px;font-weight:600;display:inline-flex;align-items:center;gap:8px}
.chip .sw{width:12px;height:12px;border-radius:50%;background:var(--c)}
.chip.on{background:var(--c,var(--ink));border-color:var(--c,var(--ink));color:#fff}
.chip.on .sw{background:#fff}
.chip.sug{border-style:dashed;border-color:var(--c)}
.hint{font-size:14px;color:var(--mute);margin-top:8px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row .inp[type=date]{flex:1 1 180px;width:auto}
.btn{min-height:50px;padding:0 22px;border-radius:14px;font-weight:700;font-size:17px;background:var(--card);box-shadow:var(--shadow);color:var(--ink);white-space:nowrap}
.btn.pri{background:var(--c,#2563eb);color:#fff}
.btn.ok{background:var(--green);color:#fff}
.btn.dark{background:var(--ink);color:var(--bg)}
.btn.danger{color:var(--red);box-shadow:none;background:transparent}
.btn.sm{min-height:42px;padding:0 16px;font-size:15px}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px;align-items:center}
.acts .grow{flex:1}
.err{color:var(--red);font-weight:600;margin-top:10px;min-height:1px}
.info{display:grid;grid-template-columns:auto 1fr;gap:10px 14px;align-items:center;font-size:16px}
.info .k{color:var(--mute);display:flex;align-items:center;gap:8px;font-size:15px}
.desc{white-space:pre-wrap}
.tl{list-style:none;margin:6px 0 0;padding:0}
.tl li{position:relative;padding:0 0 16px 26px}
.tl li::before{content:"";position:absolute;left:6px;top:8px;bottom:-6px;width:2px;background:var(--line)}
.tl li:last-child::before{display:none}
.tl li::after{content:"";position:absolute;left:0;top:4px;width:14px;height:14px;border-radius:50%;background:var(--c,#2563eb);box-shadow:0 0 0 3px var(--card)}
.tl li.sys::after{background:#9aa3af}
.tl .w{font-size:13px;color:var(--mute)}
.tl .t{white-space:pre-wrap}
.tl .del{font-size:13px;color:var(--mute);text-decoration:underline;margin-left:6px}
.addnote{display:flex;gap:10px;align-items:flex-end;margin-top:4px}
.addnote textarea{min-height:54px}

/* ---- ayarlar / personel ---- */
.card{background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:16px 18px;margin-top:14px}
.card h3{margin:0 0 4px;font-size:19px}
.card p{margin:0 0 10px;color:var(--mute);font-size:15px}
.grow-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line);text-align:left;width:100%}
.grow-row:first-of-type{border-top:0}
.sq{width:42px;height:42px;border-radius:12px;background:var(--c);display:grid;place-items:center;color:#fff;font-weight:750}
.grow-row small{display:block;color:var(--mute);font-size:14px}
.swatches{display:flex;flex-wrap:wrap;gap:10px}
.swatches button{width:40px;height:40px;border-radius:50%;background:var(--c);box-shadow:inset 0 0 0 3px var(--card)}
.swatches button.on{outline:3px solid var(--c);outline-offset:2px}
.filebtn{position:relative;overflow:hidden;display:inline-flex;align-items:center}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}

/* ---- bildirim ---- */
.toast{position:fixed;left:50%;bottom:max(96px,calc(env(safe-area-inset-bottom) + 90px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 12px 12px 18px;border-radius:14px;z-index:40;box-shadow:var(--shadow2);display:flex;gap:14px;align-items:center;max-width:92vw;font-weight:600}
.toast button{color:#60a5fa;font-weight:700;padding:6px 10px}



/* ---- bilgi notları ---- */
.notecard{display:flex;align-items:center;gap:16px;width:100%;text-align:left;background:var(--card);border-radius:20px;box-shadow:var(--shadow);padding:18px;border-left:8px solid #0f766e;min-height:88px}
.notecard .nico{width:54px;height:54px;border-radius:16px;background:#0f766e;color:#fff;display:grid;place-items:center;flex:none}
.notecard .nico svg.i{width:28px;height:28px}
.notecard .grow{flex:1}.notecard b{font-size:19px;display:block}.notecard small{color:var(--mute);font-size:15px}
.nchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.nchips span{font-size:13px;font-weight:600;background:color-mix(in srgb,#0f766e 12%,transparent);color:#0f766e;padding:2px 10px;border-radius:10px}
.crumbs{margin-top:12px;font-size:14px;opacity:.9;position:relative}.crumbs a{color:inherit}
.folders{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.fold{display:flex;align-items:center;gap:14px;background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:14px 16px;text-align:left;min-height:72px}
.fold .fico{width:46px;height:46px;border-radius:13px;background:color-mix(in srgb,#0f766e 14%,transparent);color:#0f766e;display:grid;place-items:center;flex:none}
.fold .grow{flex:1}.fold b{display:block;font-size:17px}.fold small{color:var(--mute);font-size:14px}.fold>svg.i{color:var(--mute)}
.files{list-style:none;margin:0;padding:0;background:var(--card);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
.file{display:flex;align-items:stretch;border-top:1px solid var(--line)}.file:first-child{border-top:0}
.fmain{flex:1;display:flex;align-items:center;gap:14px;padding:12px 16px;text-align:left;min-height:66px}
.fmain .grow{flex:1}.fmain b{display:block;font-size:16px;font-weight:650;overflow-wrap:anywhere}.fmain small{color:var(--mute);font-size:13px}
.ftag{flex:none;width:58px;height:40px;border-radius:9px;background:var(--c);color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center;letter-spacing:.02em}
.fmore{width:60px;color:var(--mute);font-weight:800;letter-spacing:1px;border-left:1px solid var(--line)}

.toptabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:6px;margin:12px 0 4px}
.toptabs button{display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;border-radius:13px;font-size:17px;font-weight:700;color:var(--mute)}
.toptabs button.on{background:var(--c,#2563eb);color:#fff}
.toptabs .tn{font-size:13px;font-weight:700;background:rgba(127,127,127,.18);border-radius:10px;padding:1px 8px}
.toptabs button.on .tn{background:rgba(255,255,255,.25)}
.sub2{color:var(--mute);font-size:15px;margin:10px 2px 0}
.sgrp{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
.sgrp:first-of-type{border-top:0}
.sgh{display:flex;align-items:center;gap:8px;min-height:40px}.sgh .sw{width:12px;height:12px;border-radius:50%;background:var(--c)}
.sgh b{font-size:16px}.sgh span{font-size:13px;color:var(--mute)}.sgh .grow{flex:1}
.srow{display:flex;align-items:center;gap:10px;padding:6px 0 6px 20px;flex-wrap:wrap}
.sedit{display:flex;align-items:center;gap:12px;flex:1 1 220px;min-width:0;text-align:left;min-height:52px}
.sedit .sq{width:38px;height:38px;border-radius:11px;font-size:13px}
.sedit .grow{flex:1;min-width:0}.sedit b{display:block;font-size:16px}.sedit small{color:var(--mute);font-size:13px}
.xopt{display:flex;align-items:center;gap:10px;min-height:40px;font-size:16px}
.xopt input{width:22px;height:22px}
.ghead{padding:10px clamp(16px,3.5vw,32px) 12px!important;border-radius:0 0 20px 20px!important}
.ghead::after{width:150px!important;height:150px!important;right:-50px!important;top:-70px!important}
.ghgrid{display:grid;grid-template-columns:minmax(max-content,1fr) minmax(0,auto) minmax(max-content,1fr);align-items:center;gap:12px;position:relative;z-index:1}
.ghgrid .back{justify-self:start;min-height:48px;padding:0 18px 0 10px;font-size:17px;font-weight:700;border-radius:24px;gap:4px;white-space:nowrap}
.ghgrid .back svg.i{width:24px;height:24px;stroke-width:2.5}
.ghc{text-align:center;min-width:0}
.ghc h1{margin:0!important;font-size:clamp(20px,2.6vw,27px)!important;line-height:1.15;text-wrap:balance}
.ghc .sub{font-size:13px!important;margin-top:2px}.ghc .sub a{color:inherit}
.ghc .badges{justify-content:center;margin-top:5px!important;gap:5px}
.ghc .badge{font-size:11.5px;padding:2px 9px}
.ghr{justify-self:end}
@media(max-width:640px){
  .ghgrid{grid-template-columns:auto minmax(0,1fr) auto;gap:8px}
  .ghgrid .back{min-height:42px;padding:0 12px 0 6px;font-size:15px}.ghgrid .back span{max-width:7em;overflow:hidden;text-overflow:ellipsis}
  .ghc h1{font-size:18px!important}
  .ghr .zoomc{display:none}
}
.dropping{outline:3px dashed #0f766e;outline-offset:-3px;background:color-mix(in srgb,#0f766e 8%,transparent)!important}
/* ---- bugün ---- */
.duo{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;margin-top:12px;align-items:stretch}
.duo>.today,.duo>.memo{margin-top:0;display:flex;flex-direction:column;min-width:0}
.duo>.memo .madd{margin-top:auto}
.duo>.memo .mlist{margin-bottom:6px}
@media(max-width:720px){.duo{grid-template-columns:1fr}}

.today{background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:12px 14px 8px;margin-top:12px;border-left:4px solid #7c3aed}
.thd{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-height:28px}.thd svg.i{width:17px;height:17px;color:#7c3aed}
.thd b{font-size:15px}.tcount{font-size:13px;color:var(--mute)}.tmemo{font-size:13px;color:#a16207}
.tlist{list-style:none;margin:6px 0 0;padding:0 4px 0 0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
.tlist.mfade{-webkit-mask-image:linear-gradient(#000 82%,transparent);mask-image:linear-gradient(#000 82%,transparent)}
.tlist.mfade.mend{-webkit-mask-image:none;mask-image:none}
.tlist li{border-top:1px solid var(--line)}.tlist li:first-child{border-top:0}
.titem{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:8px 2px;min-height:48px}
.tdot{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
.titem .grow{flex:1;min-width:0}.titem b{display:block;font-size:15px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.titem small{display:block;font-size:12px;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tbad{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;flex:none;max-width:48%}.tbad .badge{font-size:11px;padding:2px 8px}
.tmore{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:650;color:#7c3aed;min-height:34px;padding:0 4px}.tmore svg.i{width:15px;height:15px}
.badge.p{background:#ede9fe;color:#6d28d9}
@media (prefers-color-scheme:dark){.badge.p{background:#2e1f4d;color:#c4b5fd}}
.fol-pick{position:relative;display:inline-flex;align-items:center;gap:6px;min-height:32px;padding:0 10px;border-radius:10px;font-size:13px;font-weight:600;white-space:nowrap;cursor:pointer;color:var(--mute)}
.fol-pick svg.i{width:15px;height:15px}
.fol-pick.n{background:var(--soft);color:var(--ink)}.fol-pick.p{background:#ede9fe;color:#6d28d9}
@media (prefers-color-scheme:dark){.fol-pick.p{background:#2e1f4d;color:#c4b5fd}}
.fol-pick input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;font-size:16px}
/* ---- kilit ---- */
body.locked #screen,body.locked #fab,body.locked #modal,body.locked .toast{visibility:hidden}
#lock{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px;overflow-y:auto}
.lbox{width:100%;max-width:340px;text-align:center}
.lico{width:64px;height:64px;border-radius:20px;background:#e3120b;color:#fff;display:grid;place-items:center;margin:0 auto 10px}.lico svg.i{width:30px;height:30px}
.lbox h2{margin:0;font-size:26px}.lbox p{color:var(--mute);margin:6px 0 18px}
.ldots{display:flex;justify-content:center;gap:14px;margin-bottom:24px}
.ldots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--mute)}.ldots i.on{background:var(--ink);border-color:var(--ink)}
.lpad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.lpad button{height:68px;border-radius:20px;background:var(--card);box-shadow:var(--shadow);font-size:26px;font-weight:600}
.lpad button:active{background:var(--soft)}
.lpad .lsm{font-size:15px;color:var(--mute);box-shadow:none;background:transparent}
.lfp{text-align:left;font-size:15px;color:var(--ink)!important}
.shake{animation:shk .35s}@keyframes shk{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
/* ---- notlarım ---- */
.memo{background:#fff9e0;border-radius:16px;box-shadow:var(--shadow);padding:10px 14px 10px;margin-top:12px;border-left:4px solid #eab308;--mi:#5b4a0c}
@media (prefers-color-scheme:dark){.memo{background:#272210;--mi:#f3e3a3}}
.mhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;color:var(--mi);min-height:28px}
.mhead b{font-size:14px;font-weight:650;letter-spacing:.01em}.mhead svg.i{color:#ca8a04;width:17px;height:17px}
.mhead .badge{font-size:11px;padding:1px 8px}
.mcount{font-size:12px;color:var(--mi);opacity:.7}
.mempty{font-size:13px;color:var(--mi);opacity:.7;margin:8px 2px}
.mclr{font-size:12px;font-weight:500;color:var(--mi);text-decoration:underline;min-height:28px;opacity:.8}
.mlist{display:block;list-style:none;margin:4px 0 0;padding:0 4px 0 0;max-height:min(190px,30vh);overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
.mlist.mfade{-webkit-mask-image:linear-gradient(#000 82%,transparent);mask-image:linear-gradient(#000 82%,transparent)}
.mlist.mfade.mend{-webkit-mask-image:none;mask-image:none}
.mi{display:flex;flex:none;align-items:center;gap:6px;border-top:1px solid color-mix(in srgb,#ca8a04 18%,transparent);min-height:38px}
.mi:first-child{border-top:0}
.mchk{width:30px;height:36px;display:grid;place-items:center;flex:none}
.mchk span{width:18px;height:18px;border-radius:5px;border:2px solid #ca8a04;display:grid;place-items:center;color:transparent}
.mchk span svg.i{width:12px!important;height:12px!important}
.mi.done .mchk span{background:#ca8a04;color:#fff}
.mtx{flex:1;min-width:0;border:0;background:transparent;font:inherit;font-size:15px;line-height:1.35;font-weight:400;color:var(--ink);min-height:0;padding:8px 4px;border-radius:6px;resize:none;overflow:hidden;display:block}
.mtx:focus{outline:none;background:rgba(255,255,255,.6)}
@media (prefers-color-scheme:dark){.mtx:focus{background:rgba(0,0,0,.25)}}
.mi.done .mtx{text-decoration:line-through;color:var(--mute)}
.mdate{position:relative;display:inline-flex;align-items:center;gap:4px;min-height:26px;padding:0 7px;border-radius:7px;font-size:12px;font-weight:600;color:color-mix(in srgb,var(--mi) 55%,transparent);white-space:nowrap;flex:none}
.mdate svg.i{width:13px;height:13px}
.mdate.has{background:rgba(202,138,4,.14);color:var(--mi)}
.mi.today .mdate{background:var(--orangebg);color:var(--orange)}.mi.late .mdate{background:var(--redbg);color:var(--red)}
.mi.done .mdate{opacity:.5}
.mdate input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;font-size:16px}
.mdel{width:30px;height:36px;font-size:18px;color:color-mix(in srgb,var(--mi) 45%,transparent);flex:none}
.madd{display:flex;align-items:center;gap:8px;margin-top:6px;background:rgba(255,255,255,.7);border-radius:10px;padding:0 4px 0 10px;color:#ca8a04}
.madd svg.i{width:16px;height:16px}
@media (prefers-color-scheme:dark){.madd{background:rgba(0,0,0,.25)}}
.madd input{flex:1;min-width:0;border:0;background:transparent;font-size:15px;min-height:38px;color:var(--ink);outline:none}
.madd .btn.sm{min-height:30px;padding:0 12px;font-size:13px;border-radius:8px}
@media(max-width:560px){
  .mi{display:grid;grid-template-columns:28px minmax(0,1fr) 28px;align-items:start;gap:0 4px;padding:0 0 4px}
  .mchk{grid-column:1;grid-row:1/span 2;height:36px}.mtx{grid-column:2;grid-row:1;padding:8px 2px 2px}
  .mdate{grid-column:2;grid-row:2;justify-self:start;min-height:24px}.mdel{grid-column:3;grid-row:1/span 2}
  .mdate:not(.has){padding-left:2px}
}
/* ---- satır tablosu ---- */
.zoomc{display:inline-flex;align-items:center;gap:2px;background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:4px;color:var(--ink);position:relative;z-index:1}
.zoomc button{min-width:40px;height:40px;border-radius:10px;font-size:22px;font-weight:600;line-height:1}
.zoomc button:hover{background:var(--soft)}
.zoomc span{min-width:48px;text-align:center;font-size:14px;font-weight:700;font-variant-numeric:tabular-nums}
.zoomc .zfit{font-size:14px;font-weight:700;padding:0 12px;background:var(--soft);margin-left:4px}
.ghead .zoomc{background:rgba(255,255,255,.2);box-shadow:none;color:#fff}
.ghead .zoomc button:hover,.ghead .zoomc .zfit{background:rgba(255,255,255,.18)}
.plain .ghead .zoomc{background:var(--soft);color:var(--ink)}
.ghrow{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;position:relative;z-index:1}
.bar .zoomc{margin-right:8px}
.wrap{max-width:calc(1100px / var(--z,1))}
@media(max-width:720px){.zoomc .zfit{display:none}}
@media(max-width:560px){.bar .zoomc span{min-width:40px}.bar .zoomc button{min-width:34px}}

.dcell{border-left:1px solid var(--line);display:flex;flex-direction:column;min-width:0}
.dcell .desc-in{border-left:0}
.trow.done .dcell{border-color:color-mix(in srgb,var(--green) 22%,transparent)}
.subs{list-style:none;margin:-4px 0 2px;padding:0 8px 0 10px}
.stask{display:flex;align-items:center;gap:4px;min-height:34px}
.subchk{width:28px;height:34px;display:grid;place-items:center;flex:none}
.subchk span{width:18px;height:18px;border-radius:5px;border:2px solid color-mix(in srgb,var(--c,#2563eb) 70%,var(--line));display:grid;place-items:center;color:transparent}
.stask.done .subchk span{background:var(--green);border-color:var(--green);color:#fff}
.subtx{flex:1;min-width:0;border:0;background:transparent;font-size:15px;color:var(--ink);padding:5px 4px;min-height:32px;border-radius:6px}
.subtx:focus{outline:none;background:color-mix(in srgb,var(--c,#2563eb) 8%,var(--card))}
.stask.done .subtx{text-decoration:line-through;color:var(--mute)}
.subdel{width:28px;height:34px;font-size:18px;color:var(--mute);opacity:.55;flex:none}
.subadd{align-self:flex-start;display:inline-flex;align-items:center;gap:4px;margin:0 10px 10px;padding:0 8px;min-height:30px;border-radius:8px;font-size:13px;font-weight:650;color:color-mix(in srgb,var(--c,#2563eb) 80%,var(--mute))}
.subadd svg.i{width:14px;height:14px}
.subadd:hover,.subadd:focus-visible{background:var(--soft)}
.sprog{display:inline-flex;align-items:center;gap:3px;font-size:12px;font-weight:700;padding:2px 8px;border-radius:8px;background:var(--soft);color:var(--ink)}
.sprog svg.i{width:13px;height:13px}
.sprog.ok{background:var(--greenbg);color:var(--green)}
.dsubs{margin:0 0 8px;padding:0}

.docs{padding:10px 8px;display:flex;flex-direction:column;gap:6px;align-items:stretch;border-left:1px solid var(--line)}
.trow.done .docs{border-color:color-mix(in srgb,var(--green) 22%,transparent)}
.dtag{display:flex;align-items:center;background:var(--soft);border-radius:10px;min-width:0}
.dopen{flex:1;min-width:0;display:flex;align-items:center;gap:7px;padding:4px 4px 4px 4px;min-height:36px;text-align:left}
.ftag.sm{width:38px;height:24px;font-size:9px;border-radius:6px}
.dn{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.dmenu{width:32px;min-height:36px;color:var(--mute);font-size:12px;font-weight:800;flex:none}
.dadd{position:relative;display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 10px;border-radius:10px;font-size:14px;font-weight:650;color:var(--c,#2563eb);border:1.5px dashed color-mix(in srgb,var(--c,#2563eb) 40%,var(--line));cursor:pointer;align-self:flex-start}
.dadd svg.i{width:16px;height:16px}
.dadd input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}

.sfil{position:relative;display:inline-flex;align-items:center;gap:8px;background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:0 12px 0 14px;min-height:52px;color:var(--mute);flex:0 1 auto}
.sfil select{appearance:none;-webkit-appearance:none;border:0;background:transparent;font-size:16px;font-weight:600;color:var(--ink);min-height:50px;padding:0 26px 0 0;max-width:260px;cursor:pointer;outline:none;
  background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);background-position:right 9px center,right 4px center;background-size:5px 5px;background-repeat:no-repeat}
.sfil.on{background:var(--c,#2563eb);color:#fff}.sfil.on select{color:#fff}
.plain .sfil.on{--c:#2563eb}

.nbtn{display:inline-flex;align-items:center;gap:5px;min-height:32px;padding:0 10px;border-radius:10px;background:color-mix(in srgb,var(--c,#2563eb) 12%,transparent);color:var(--c,#2563eb);font-size:13px;font-weight:700}
.nbtn svg.i{width:16px;height:16px}

.ptag{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:600;color:var(--ink);background:var(--soft);border-radius:14px;padding:2px 9px 2px 2px}
.ptag .av{width:22px;height:22px;font-size:10px;margin:0;border:0}
.trow.done .ptag{background:transparent}
.pfil{display:flex;gap:8px;align-items:center;overflow-x:auto;padding:4px 2px 6px;margin-top:12px;scrollbar-width:thin}
.pfil .pl{font-size:14px;font-weight:700;color:var(--mute);flex:none;margin-right:2px}
.pfil .chip{flex:none;min-height:42px;padding:0 14px 0 6px;font-size:15px}
.pfil .chip[data-sf=""],.pfil .chip[data-sf="-"]{padding:0 14px}
.pfil .chip .av{width:28px;height:28px;font-size:11px;margin:0;border:0}
.pfil .chip.on .av{background:#fff;color:var(--c)}
.pfil .cn{font-size:13px;font-weight:700;opacity:.7}

:root{--cols:58px minmax(260px,1fr) minmax(340px,1.3fr) minmax(220px,.8fr) 180px 72px}
.tscroll{position:relative;overflow-x:auto;scroll-padding-left:330px;overflow-y:hidden;margin-top:16px;background:var(--card);border-radius:18px;box-shadow:var(--shadow);-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;scrollbar-width:thin}
.tgrid{min-width:1130px}
.tscroll::after{content:"";position:sticky;display:block;float:right;right:0;top:0;width:0;height:0}
.tscroll.canr{-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 40px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 40px),transparent)}
.shint{display:flex;align-items:center;justify-content:center;gap:6px;font-size:13px;color:var(--mute);margin-top:8px}
.tscroll .thead{background:var(--soft);margin:0;padding:10px 0 10px 0;border-bottom:1px solid var(--line)}
.tscroll .thead span:nth-child(1),.tscroll .thead span:nth-child(2){position:sticky;z-index:2;background:var(--soft)}
.tscroll .thead span:nth-child(1){left:0}.tscroll .thead span:nth-child(2){left:58px;box-shadow:6px 0 8px -8px rgba(0,0,0,.35)}
.tscroll .rows{box-shadow:none;border-radius:0;background:transparent;overflow:visible}
.trow{--rowbg:var(--card);background:var(--rowbg);border-left:0!important}
.trow.done{--rowbg:var(--greenbg)}
.trow .chk{position:sticky;left:0;z-index:2;background:var(--rowbg);box-shadow:inset 5px 0 0 var(--stc,transparent)}
.trow.late{--stc:var(--red)}.trow.soon{--stc:var(--orange)}.trow.done{--stc:var(--green)}
.trow .ttl-in{position:sticky;left:58px;z-index:2;background:var(--rowbg);box-shadow:6px 0 8px -8px rgba(0,0,0,.35)}
.trow .ttl-in:focus{background:color-mix(in srgb,var(--c,#2563eb) 7%,var(--rowbg));box-shadow:inset 0 -2px 0 var(--c,#2563eb),6px 0 8px -8px rgba(0,0,0,.35)}
.thead{display:grid;grid-template-columns:var(--cols);padding:0 0 8px 5px;margin-top:18px;font-size:13px;font-weight:700;color:var(--mute)}
.thead span{padding:0 12px}
.rows{list-style:none;margin:0;padding:0;background:var(--card);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
.rows .empty{box-shadow:none;border-radius:0}
.trow{display:grid;grid-template-columns:var(--cols);align-items:stretch;border-top:1px solid var(--line);border-left:5px solid transparent}
.trow:first-child{border-top:0}
.trow.late{border-left-color:var(--red)}.trow.soon{border-left-color:var(--orange)}
.trow.done{background:var(--greenbg);border-left-color:var(--green)}
.trow .chk{width:100%;min-height:58px;align-self:start;padding-top:13px;display:flex;justify-content:center}
.trow.done .chk span{background:var(--green);border-color:var(--green);color:#fff}
.cell{display:block;width:100%;border:0;background:transparent;resize:none;overflow:hidden;padding:16px 12px;font-size:17px;line-height:1.4;min-height:58px;color:var(--ink);border-radius:0;font-family:inherit}
.cell::placeholder{color:#a3aab5}
.cell:focus{outline:none;background:color-mix(in srgb,var(--c,#2563eb) 7%,var(--card));box-shadow:inset 0 -2px 0 var(--c,#2563eb)}
.ttl-in{font-weight:650}
.desc-in{color:var(--mute);border-left:1px solid var(--line)}
.desc-in:focus{color:var(--ink)}
.trow.done .ttl-in{color:var(--green)}
.trow.done .cell,.trow.done .side,.trow.done .desc-in{border-color:color-mix(in srgb,var(--green) 22%,transparent)}
.side{padding:11px 10px;display:flex;flex-direction:column;gap:7px;align-items:flex-start;border-left:1px solid var(--line)}
.due-pick{position:relative;display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 11px;border-radius:10px;font-size:14px;font-weight:650;background:var(--soft);color:var(--ink);white-space:nowrap;cursor:pointer}
.due-pick svg.i{width:16px;height:16px}
.due-pick.e{color:var(--mute);font-weight:500}
.due-pick.r{background:var(--redbg);color:var(--red)}.due-pick.o{background:var(--orangebg);color:var(--orange)}.due-pick.g{background:transparent;color:var(--green);padding-left:0}
.due-pick input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;font-size:16px}
.side .tmeta:empty{display:none}
.more{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;color:var(--c,var(--mute));font-size:12px;font-weight:700;border-left:1px solid var(--line)}
.trow.done .more{border-color:color-mix(in srgb,var(--green) 22%,transparent)}
.addrow{width:100%;min-height:58px;margin-top:12px;border:2px dashed color-mix(in srgb,var(--c,#2563eb) 50%,var(--line));border-radius:16px;color:var(--c,#2563eb);font-weight:700;font-size:17px;background:transparent;display:flex;align-items:center;justify-content:center;gap:8px}
.plain .addrow{--c:#2563eb}
.pick{display:flex;align-items:center;gap:14px;width:100%;padding:12px 14px;border-radius:16px;background:var(--card);box-shadow:var(--shadow);margin-top:10px;font-weight:700;font-size:17px;text-align:left;border-left:7px solid var(--c);min-height:64px}
.pick .sq{width:40px;height:40px}.pick .sq svg.i{color:#fff}
.pick .grow{flex:1}.pick small{display:block;font-weight:500;font-size:14px;color:var(--mute)}
.pick.hit{outline:2px solid var(--c)}
.pick>svg.i{color:var(--mute)}
@media(max-width:720px){
  .thead{display:none}.tgrid{min-width:0}.tscroll{overflow-x:visible}.shint{display:none!important}.tscroll.canr{-webkit-mask-image:none;mask-image:none}
  .trow .chk,.trow .ttl-in{position:static;box-shadow:none}.trow .chk{box-shadow:inset 4px 0 0 var(--stc,transparent)}
  .trow{grid-template-columns:50px minmax(0,1fr) 54px}
  .trow .chk{grid-column:1;grid-row:1/span 4}
  .ttl-in{grid-column:2;grid-row:1;padding:14px 8px 2px;min-height:0}
  .dcell{grid-column:2;grid-row:2;border-left:0}
  .desc-in{border-left:0;padding:2px 8px 6px;min-height:0;font-size:16px}
  .subs{padding:0 8px 0 4px}.subadd{margin:0 4px 8px}
  .docs{grid-column:2;grid-row:4;border-left:0;padding:0 8px 12px;flex-direction:row;flex-wrap:wrap}

}
@media(max-width:560px){
  .stats{gap:8px}.stat{padding:12px;min-height:92px}.stat span{font-size:13px}

<body>
<main class="wrap" id="screen"></main>
<button class="fab hide" id="fab"></button>
<div id="modal" class="modal hide" role="dialog" aria-modal="true"><div class="sheet" id="sheet"></div></div>

<script>
{
const DENEME=false;
const $=s=>document.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const AY=['Oca','Şub','Mar','Nis','May','Haz','Tem','Ağu','Eyl','Eki','Kas','Ara'];
const KEY='daire-is-takip-veri';
const COLORS=['#2563eb','#0f9d8a','#7c3aed','#e8590c','#db2777','#16a34a','#0891b2','#b45309'];
const GENEL_C='#475569';
const IC={
  back:'<path d="M15 18l-6-6 6-6"/>',gear:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3h0a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8v0a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',search:'<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>',check:'<path d="M20 6L9 17l-5-5"/>',
  folder:'<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',inbox:'<path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.5 5h13L22 12v6a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2v-6z"/>',
  cal:'<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',note:'<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>',
  users:'<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8"/>',
  done:'<circle cx="12" cy="12" r="10"/><path d="M8 12l3 3 5-6"/>',flag:'<path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><path d="M4 22v-7"/>',
  doc:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/>',chev:'<path d="M9 18l6-6-6-6"/>',lock:'<rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>',clip:'<path d="M21.4 11.1l-9.2 9.2a6 6 0 0 1-8.5-8.5l9.2-9.2a4 4 0 0 1 5.7 5.7l-9.2 9.2a2 2 0 0 1-2.8-2.8l8.5-8.5"/>',save:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/>'
};
const ic=(n,s='')=>`<svg class="i" viewBox="0 0 24 24" ${s}>${IC[n]}</svg>`;
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const pad=n=>String(n).padStart(2,'0');
const todayS=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const nowS=()=>{const d=new Date();return todayS()+'T'+pad(d.getHours())+':'+pad(d.getMinutes())};
const addDays=(s,n)=>{const d=new Date(s+'T00:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)};
const diff=s=>Math.round((Date.parse(s+'T00:00:00Z')-Date.parse(todayS()+'T00:00:00Z'))/864e5);
const fmtD=s=>{const[y,m,d]=String(s).split('-');return +d+' '+AY[m-1]+(y!==todayS().slice(0,4)?' '+y:'')};
const fmtT=s=>{if(!s)return'';const[d,t]=s.split('T');return fmtD(d)+(t?', '+t.slice(0,5):'')};
const tlow=s=>String(s||'').toLocaleLowerCase('tr');
const arr=v=>Array.isArray(v)?v:[];
const initials=n=>String(n||'?').trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toLocaleUpperCase('tr');
const okColor=c=>/^#[0-9a-f]{6}$/i.test(c||'')?c:null;

/* ================= veri (yalnızca bu cihazda) ================= */
const EMPTY=()=>({groups:[],staff:[],tasks:[],folders:[],files:[],memos:[],settings:{warn:3},lastBackup:null});
function normalize(d){
  d=d&&typeof d==='object'?d:EMPTY();
  d.groups=arr(d.groups).filter(g=>g&&g.id).map((g,i)=>({id:String(g.id),name:String(g.name||'Grup'),keywords:String(g.keywords||''),color:okColor(g.color)||COLORS[i%COLORS.length]}));
  d.staff=arr(d.staff).filter(s=>s&&s.id).map(s=>({id:String(s.id),name:String(s.name||''),title:String(s.title||''),group:s.group?String(s.group):''}));
  d.tasks=arr(d.tasks).filter(t=>t&&t.id).map(t=>({id:String(t.id),title:String(t.title||''),descr:String(t.descr||''),ref:String(t.ref||''),
    due:/^\d{4}-\d{2}-\d{2}$/.test(t.due||'')?t.due:'',follow:/^\d{4}-\d{2}-\d{2}$/.test(t.follow||'')?t.follow:'',prio:['normal','yuksek','acil'].includes(t.prio)?t.prio:'normal',
    status:t.status==='done'?'done':'open',created:String(t.created||''),doneAt:t.doneAt?String(t.doneAt):'',
    groups:arr(t.groups).map(String),staff:arr(t.staff).map(String),
    notes:arr(t.notes).filter(n=>n&&n.text).map(n=>({id:String(n.id||uid()),at:String(n.at||''),text:String(n.text)})),
    subs:arr(t.subs).filter(x=>x&&x.id).map(x=>({id:String(x.id),text:String(x.text||'').slice(0,200),done:!!x.done}))}));
  d.folders=arr(d.folders).filter(f=>f&&f.id).map(f=>({id:String(f.id),name:String(f.name||'Klasör').slice(0,120),parent:f.parent?String(f.parent):'',created:String(f.created||'')}));
  const fids=new Set(d.folders.map(f=>f.id));d.folders.forEach(f=>{if(f.parent&&!fids.has(f.parent))f.parent=''});
  const tids=new Set(d.tasks.map(t=>t.id));
  d.files=arr(d.files).filter(f=>f&&f.id&&(!f.task||tids.has(String(f.task)))).map(f=>({id:String(f.id),task:f.task?String(f.task):'',folder:!f.task&&fids.has(String(f.folder||''))?String(f.folder):'',name:String(f.name||'evrak').slice(0,200),type:String(f.type||''),size:+f.size||0,added:String(f.added||'')}));
  d.memos=arr(d.memos).filter(m=>m&&m.id).map(m=>({id:String(m.id),text:String(m.text||'').slice(0,300),date:/^\d{4}-\d{2}-\d{2}$/.test(m.date||'')?m.date:'',done:!!m.done,created:String(m.created||'')}));
  {const os=d.settings||{};const z=Math.max(.4,Math.min(1.6,+os.zoom||1));const bz=+os.base;
   const pn=os.pin&&typeof os.pin.h==='string'&&+os.pin.len>=4&&+os.pin.len<=6&&typeof os.pin.salt==='string'?{h:os.pin.h,len:+os.pin.len,salt:os.pin.salt}:null;
   d.settings={warn:Math.max(1,Math.min(60,+os.warn||3)),zoom:z,base:bz>=.4&&bz<=1.6?bz:z,pin:pn};}
  d.lastBackup=d.lastBackup||null;
  return d;
}
let D,storageOK=true;
try{D=normalize(JSON.parse(localStorage.getItem(KEY)||'null'))}catch(e){D=EMPTY();storageOK=false}
const firstRun=!D.groups.length&&!D.tasks.length;
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(D));return true}
  catch(e){storageOK=false;toast('Kayıt yapılamadı! Cihaz hafızası dolu olabilir.');return false}
}
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}

const warn=()=>D.settings.warn;
const G=id=>D.groups.find(g=>g.id===id);
const gName=id=>(G(id)||{}).name||'Silinmiş grup';
const gColor=id=>(G(id)||{}).color||GENEL_C;
const S=id=>D.staff.find(s=>s.id===id);
const sName=id=>(S(id)||{}).name||'Silinmiş kişi';
const isLate=t=>t.status!=='done'&&t.due&&diff(t.due)<0;
const isFollow=t=>t.status!=='done'&&t.follow&&diff(t.follow)<=0;
const isToday=t=>t.status!=='done'&&((t.due&&diff(t.due)<=0)||(t.follow&&diff(t.follow)<=0));
const isSoon=t=>t.status!=='done'&&t.due&&diff(t.due)>=0&&diff(t.due)<=warn();
const openOf=a=>a.filter(t=>t.status!=='done');
const ofGroup=id=>D.tasks.filter(t=>id?t.groups.includes(id):!t.groups.length);
const taskColor=t=>t.groups.length?gColor(t.groups[0]):GENEL_C;
function dueTxt(t){
  if(t.status==='done')return{c:'g',t:'Tamamlandı'};
  if(!t.due)return null;
  const n=diff(t.due);
  if(n<0)return{c:'r',t:(-n)+' gün gecikti'};
  if(n===0)return{c:'o',t:'Bugün son gün'};
  if(n===1)return{c:'o',t:'Yarın son gün'};
  if(n<=warn())return{c:'o',t:n+' gün kaldı'};
  return{c:'n',t:'Son gün '+fmtD(t.due)};
}
function sortTasks(a){
  const pr={acil:0,yuksek:1,normal:2};
  return a.sort((x,y)=>{
    const dx=x.status==='done',dy=y.status==='done';
    if(dx!==dy)return dx?1:-1;
    if(dx)return y.doneAt.localeCompare(x.doneAt);
    if(x.due&&y.due&&x.due!==y.due)return x.due<y.due?-1:1;
    if(!!x.due!==!!y.due)return x.due?-1:1;
    if(pr[x.prio]!==pr[y.prio])return pr[x.prio]-pr[y.prio];
    return y.created.localeCompare(x.created);
  });
}
function toast(m,undo){
  document.querySelectorAll('.toast').forEach(t=>t.remove());
  const t=document.createElement('div');t.className='toast';
  const s=document.createElement('span');s.textContent=m;t.appendChild(s);
  if(undo){const b=document.createElement('button');b.textContent='Geri al';b.onclick=()=>{undo();t.remove()};t.appendChild(b)}
  document.body.appendChild(t);setTimeout(()=>t.remove(),undo?5000:3200);
}

/* ================= yönlendirme ================= */
let segDone=false,q='';
const route=()=>decodeURIComponent(location.hash.slice(1))||'ana';
function go(h){if(route()===h)render();else location.hash=h}
window.addEventListener('hashchange',()=>{segDone=false;staffF='';tableX=0;keepId=null;closeModal(true);render();window.scrollTo(0,0)});

function render(){
  const r=route();
  const late=D.tasks.filter(isLate).length;
  document.title=(late?'('+late+') ':'')+'İş Takip';
  try{if(navigator.setAppBadge){late?navigator.setAppBadge(late):navigator.clearAppBadge()}}catch(e){}
  if(r==='ana')return home();
  if(r.startsWith('g-')&&G(r.slice(2)))return listScreen({kind:'group',id:r.slice(2)});
  if(r==='genel')return listScreen({kind:'genel'});
  if(['gecikmis','yaklasan','acik','tamam','ara','bugun'].includes(r))return listScreen({kind:r});
  if(r==='personel')return staffScreen();
  if(r.startsWith('p-')&&S(r.slice(2)))return listScreen({kind:'staff',id:r.slice(2)});
  if(r==='ayarlar')return settingsScreen();
  if(r==='notlar')return notesHome();
  if(r.startsWith('k-')&&F(r.slice(2)))return folderScreen(r.slice(2));
  location.hash='ana';
}
function setFab(label,color,onClick){
  const f=$('#fab');
  if(!label){f.classList.add('hide');return}
  f.classList.remove('hide');f.style.setProperty('--c',color||'#2563eb');
  f.innerHTML=ic('plus')+esc(label);f.onclick=onClick;
}

/* ================= PIN kilidi ================= */
function pinHash(pin,salt){let h1=0x811c9dc5,h2=0x1b873593;const s=salt+':'+pin;
  for(let r=0;r<20000;r++){for(let i=0;i<s.length;i++){const c=s.charCodeAt(i)+r;h1=Math.imul(h1^c,16777619)>>>0;h2=Math.imul(h2^(c*31+h1),2246822507)>>>0}}
  return h1.toString(16).padStart(8,'0')+h2.toString(16).padStart(8,'0')}
let locked=false,pinBuf='',pinFails=0,pinWaitUntil=0,hiddenAt=0;
const LOCK_AFTER=60000;
function lockNow(){
  if(!D.settings.pin)return;locked=true;pinBuf='';document.body.classList.add('locked');
  let el=$('#lock');if(!el){el=document.createElement('div');el.id='lock';document.body.appendChild(el)}
  el.innerHTML=`<div class="lbox"><div class="lico">${ic('flag')}</div><h2>İş Takip</h2><p id="lmsg">PIN kodunuzu girin</p>
    <div class="ldots">${Array.from({length:D.settings.pin.len},(_,i)=>`<i data-i="${i}"></i>`).join('')}</div>
    <div class="lpad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-k="${n}">${n}</button>`).join('')}<button data-k="forgot" class="lsm">Unuttum</button><button data-k="0">0</button><button data-k="del" class="lsm" aria-label="Sil">⌫</button></div></div>`;
  el.classList.remove('hide');
}
function pinDots(){document.querySelectorAll('#lock .ldots i').forEach((d,i)=>d.classList.toggle('on',i<pinBuf.length))}
function pinKey(k){
  if(!locked)return;
  if(Date.now()<pinWaitUntil){$('#lmsg').textContent='Çok fazla hatalı deneme. '+Math.ceil((pinWaitUntil-Date.now())/1000)+' saniye bekleyin.';return}
  if(k==='forgot')return pinForgot();
  if(k==='del'){pinBuf=pinBuf.slice(0,-1);pinDots();return}
  if(!/^\d$/.test(k)||pinBuf.length>=D.settings.pin.len)return;
  pinBuf+=k;pinDots();
  if(pinBuf.length===D.settings.pin.len)setTimeout(()=>{
    if(pinHash(pinBuf,D.settings.pin.salt)===D.settings.pin.h){locked=false;pinFails=0;document.body.classList.remove('locked');$('#lock').classList.add('hide');render()}
    else{pinFails++;pinBuf='';const bx=$('#lock .lbox');bx.classList.remove('shake');void bx.offsetWidth;bx.classList.add('shake');pinDots();
      if(pinFails>=5){pinWaitUntil=Date.now()+30000;pinFails=0;$('#lmsg').textContent='Çok fazla hatalı deneme. 30 saniye bekleyin.'}
      else $('#lmsg').textContent='PIN hatalı, tekrar deneyin'}},120);
}
function pinForgot(){
  $('#lock .lbox').innerHTML=`<h2>PIN'i unuttum</h2><p class="lfp">PIN kodu hiçbir yerde açık olarak saklanmaz; kurtarılamaz. Uygulamayı sıfırlayabilirsiniz: <b>bu cihazdaki bütün işler, notlar ve evraklar silinir.</b> Daha önce aldığınız bir yedek varsa, sıfırladıktan sonra "Yedekten geri yükle" ile geri getirebilirsiniz.</p>
    <label class="lbl" for="rsT" style="color:inherit">Onaylamak için SİL yazın</label><input class="inp" id="rsT" autocomplete="off">
    <div class="acts"><button class="btn" id="rsBack">Geri dön</button><span class="grow"></span><button class="btn danger" id="rsGo" style="background:var(--red);color:#fff">Her şeyi sil ve sıfırla</button></div>`;
  $('#rsBack').addEventListener('click',lockNow);
  $('#rsGo').addEventListener('click',async()=>{if($('#rsT').value.trim().toLocaleUpperCase('tr')!=='SİL'){$('#rsT').focus();return}
    try{localStorage.removeItem(KEY)}catch(e){}try{await fclear()}catch(e){}location.hash='';location.reload()});
}
document.addEventListener('click',e=>{const b=e.target.closest('#lock [data-k]');if(b)pinKey(b.dataset.k)});
document.addEventListener('keydown',e=>{if(!locked||$('#rsT'))return;if(/^\d$/.test(e.key))pinKey(e.key);else if(e.key==='Backspace')pinKey('del')});
document.addEventListener('visibilitychange',()=>{if(document.hidden)hiddenAt=Date.now();else if(D.settings.pin&&!locked&&hiddenAt&&Date.now()-hiddenAt>LOCK_AFTER)lockNow()});
function pinForm(mode){
  const has=!!D.settings.pin;
  openSheet('pin',{color:'#334155',head:`<h2>${mode==='set'?'PIN belirle':mode==='change'?'PIN değiştir':'PIN kaldır'}</h2><div class="sub">${mode==='remove'?'Uygulama açılışta PIN sormaz.':'Uygulama açılışta ve 1 dakikadan uzun süre kapalı kaldığında bu PIN\'i sorar.'}</div>`,
    body:`<div class="box">${has?`<label class="lbl" for="pOld">Mevcut PIN</label><input class="inp" id="pOld" type="password" inputmode="numeric" maxlength="6" autocomplete="off">`:''}
      ${mode!=='remove'?`<label class="lbl" for="pNew" style="margin-top:14px">Yeni PIN (4–6 rakam)</label><input class="inp" id="pNew" type="password" inputmode="numeric" maxlength="6" autocomplete="off">
      <label class="lbl" for="pNew2" style="margin-top:14px">Yeni PIN (tekrar)</label><input class="inp" id="pNew2" type="password" inputmode="numeric" maxlength="6" autocomplete="off">`:''}
      <p class="hint">PIN'i unutursanız kurtarılamaz; uygulamayı sıfırlayıp yedekten geri yüklemeniz gerekir. Bu yüzden düzenli yedek alın.</p></div>
      <div class="err" id="pErr"></div>
      <div class="acts"><span class="grow"></span><button class="btn" data-close>Vazgeç</button><button class="btn pri" id="pSave" style="--c:#334155">${mode==='remove'?'PIN\'i kaldır':'Kaydet'}</button></div>`});
  setTimeout(()=>($('#pOld')||$('#pNew'))?.focus(),60);
  $('#pSave').addEventListener('click',()=>{
    const err=m=>{$('#pErr').textContent=m};
    if(has&&pinHash($('#pOld').value,D.settings.pin.salt)!==D.settings.pin.h)return err('Mevcut PIN hatalı.');
    if(mode==='remove'){D.settings.pin=null;save();closeModal(true);render();toast('PIN kaldırıldı');return}
    const n=$('#pNew').value;if(!/^\d{4,6}$/.test(n))return err('PIN 4 ile 6 arasında rakamdan oluşmalı.');
    if(n!==$('#pNew2').value)return err('İki PIN aynı değil.');
    const salt=uid();D.settings.pin={h:pinHash(n,salt),len:n.length,salt};save();closeModal(true);render();toast('PIN kaydedildi. Bir dahaki açılışta sorulacak.')});
}
/* ================= görünüm boyutu ================= */
const zpct=()=>Math.round(D.settings.zoom/D.settings.base*100);
const zoomCtl=fit=>`<div class="zoomc" role="group" aria-label="Görünüm boyutu"><button data-z="-" aria-label="Küçült">−</button><span>${zpct()}%</span><button data-z="+" aria-label="Büyüt">+</button>${fit?'<button data-z="fit" class="zfit">Sığdır</button>':''}</div>`;
function applyZoom(){const z=D.settings.zoom;document.body.style.zoom=z;document.documentElement.style.setProperty('--z',z)}
document.addEventListener('click',e=>{const b=e.target.closest('[data-z]');if(!b)return;
  let z=D.settings.zoom;
  const base=D.settings.base;
  if(b.dataset.z==='+'||b.dataset.z==='-'){let pc=Math.round(zpct()/10)*10+(b.dataset.z==='+'?10:-10);pc=Math.max(50,Math.min(150,pc));z=Math.max(.4,Math.min(1.6,base*pc/100))}
  else if(b.dataset.z==='set100'){D.settings.base=D.settings.zoom;save();render();toast('Şu anki görünüm %100 olarak ayarlandı');return}
  else{
    const t=$('#tsc');if(!t)return;
    z=Math.max(D.settings.zoom,base);D.settings.zoom=z;applyZoom();render();
    for(let i=0;i<20;i++){const tt=$('#tsc');if(!tt||tt.scrollWidth<=tt.clientWidth+1||z<=.4)break;z=Math.round((z-.05)*20)/20;D.settings.zoom=z;applyZoom();render()}

const fixedSort=()=>ctx&&['bugun','gecikmis','yaklasan'].includes(ctx.o.kind);

function rowHTML(t){
  const st=t.status==='done'?'done':isLate(t)?'late':isSoon(t)?'soon':'';const dl=dueLabel(t);
  return `<li class="trow ${st}" data-id="${esc(t.id)}" style="--c:${taskColor(t)}">
    <button class="chk" data-chk="${esc(t.id)}" aria-label="${t.status==='done'?'Yeniden aç':'Tamamlandı olarak işaretle'}"><span>${ic('check','style="width:18px;height:18px;stroke-width:3"')}</span></button>
    <textarea class="cell ttl-in" data-f="title" rows="1" maxlength="300" placeholder="İşi yazın" aria-label="İş">${esc(t.title)}</textarea>
    <div class="dcell"><textarea class="cell desc-in" data-f="descr" rows="1" placeholder="Açıklama ekleyin" aria-label="Açıklama">${esc(t.descr)}</textarea>
      ${t.subs.length?`<ul class="subs">${t.subs.map(x=>`<li class="stask ${x.done?'done':''}" data-sub="${esc(x.id)}"><button class="subchk" data-subchk aria-label="${x.done?'Geri al':'Alt işi tamamla'}"><span>${ic('check','style="width:12px;height:12px;stroke-width:3.5"')}</span></button><input class="subtx" data-subtx maxlength="200" value="${esc(x.text)}" placeholder="Alt iş yazın" aria-label="Alt iş"><button class="subdel" data-subdel aria-label="Alt işi sil">×</button></li>`).join('')}</ul>`:''}
      <button class="subadd" data-subadd>${ic('plus')} Alt iş ekle</button></div>
    <div class="docs">${taskFiles(t.id).map(f=>{const k=ftype(f);return `<span class="dtag"><button class="dopen" data-fopen="${esc(f.id)}" title="${esc(f.name)}"><span class="ftag sm" style="--c:${k.c}">${esc(k.k)}</span><span class="dn">${esc(f.name)}</span></button><button class="dmenu" data-fmenu="${esc(f.id)}" aria-label="Belge işlemleri">•••</button></span>`}).join('')}
      <label class="dadd">${ic('clip')}<span>${taskFiles(t.id).length?'Ekle':'Belge ekle'}</span><input type="file" multiple data-tup="${esc(t.id)}" aria-label="İşe belge ekle"></label></div>
    <div class="side">
      <label class="due-pick ${dl.c}">${ic('cal')}<span>${esc(dl.t)}</span>${t.status==='done'?'':`<input type="date" data-f="due" value="${esc(t.due)}" aria-label="Son gün">`}</label>
      ${t.status==='done'?'':(()=>{const n=t.follow?diff(t.follow):null;const c=!t.follow?'e':n<=0?'p':'n';
        const tx=!t.follow?'Takip tarihi':n<0?'Takip: '+(-n)+' gün geçti':n===0?'Bugün takip et':n===1?'Takip: yarın':'Takip: '+fmtD(t.follow);
        return `<label class="fol-pick ${c}" title="Ne zaman soracağınız">${ic('flag')}<span>${esc(tx)}</span><input type="date" data-f="follow" value="${esc(t.follow)}" aria-label="Takip tarihi"></label>`})()}
      <span class="tmeta">${t.subs.length?(()=>{const dn=t.subs.filter(x=>x.done).length;return `<span class="sprog ${dn===t.subs.length?'ok':''}" title="Tamamlanan alt işler">${ic('check')}${dn}/${t.subs.length}</span>`})():''}${t.prio!=='normal'?`<span class="prio ${t.prio}">${t.prio==='acil'?'ACİL':'ÖNCELİKLİ'}</span>`:''}
        ${ctx&&ctx.showG?(t.groups.length?t.groups.map(g=>`<span class="gchip" style="--c:${gColor(g)}">${esc(gName(g))}</span>`).join(''):`<span class="gchip" style="--c:${GENEL_C}">Genel</span>`):(t.groups.length>1?`<span class="gchip" style="--c:${GENEL_C}">+${t.groups.length-1} grup</span>`:'')}
        ${t.staff.map(s=>`<span class="ptag"><span class="av" style="--c:${(S(s)&&S(s).group)?gColor(S(s).group):GENEL_C}">${esc(initials(sName(s)))}</span>${esc(sName(s))}</span>`).join('')}
        ${t.notes.length?`<button class="nbtn" data-notes="${esc(t.id)}" aria-label="Yapılan işlemleri göster">${ic('note')}${t.notes.length} not</button>`:''}</span>
    </div>
    <button class="more" data-open="${esc(t.id)}" aria-label="Ayrıntıları aç"><span>Detay</span>${ic('chev')}</button></li>`;
}
function refreshRow(id){
  const r=rowEl(id),t=D.tasks.find(x=>x.id===id);if(!r)return;
  if(!t){r.remove();drawBadges();return}
  r.outerHTML=rowHTML(t);const n=rowEl(id);n.querySelectorAll('textarea').forEach(autosize);drawBadges();
}
function addRow(){
  if(!ctx||!ctx.canAdd)return;
  if(freshId){const f=D.tasks.find(t=>t.id===freshId);if(f&&isEmptyTask(f)){const r=rowEl(freshId);if(r){r.querySelector('[data-f=title]').focus();return}}}
  const t={id:uid(),title:'',descr:'',ref:'',due:'',prio:'normal',status:'open',created:nowS(),doneAt:'',
    groups:[...(ctx.defaults.groups||[])],staff:[...(ctx.defaults.staff||[])],notes:[],subs:[]};
  if(staffF&&staffF!=='-'&&!t.staff.includes(staffF))t.staff.push(staffF);
  D.tasks.push(t);freshId=t.id;
  if(q){q='';const i=$('#lq');if(i)i.value=''}
  const tl=$('#tl');tl.querySelector('.empty')?.remove();
  if(sortMode==='gun'||q||staffF==='-'){if(staffF==='-')staffF='';drawRows()}else{tl.insertAdjacentHTML('beforeend',rowHTML(t))}
  const r=rowEl(t.id);r.querySelectorAll('textarea').forEach(autosize);
  const inp=r.querySelector('[data-f=title]');inp.focus();r.scrollIntoView({block:'center',behavior:'smooth'});
}
/* satır içi düzenleme */
$('#screen').addEventListener('input',e=>{
  const el=e.target.closest('textarea[data-f]');if(!el)return;
  const t=D.tasks.find(x=>x.id===el.closest('.trow').dataset.id);if(!t)return;
  t[el.dataset.f]=el.value.slice(0,el.dataset.f==='title'?300:4000);autosize(el);saveSoon();
});
function subCtx(el){const id=el.closest('.trow').dataset.id,t=D.tasks.find(x=>x.id===id);const li=el.closest('[data-sub]');return {id,t,sub:li&&t?t.subs.find(x=>x.id===li.dataset.sub):null}}
function focusSub(id,subId){const r=rowEl(id);if(!r)return;const li=[...r.querySelectorAll('[data-sub]')].find(x=>x.dataset.sub===subId);const i=li&&li.querySelector('[data-subtx]');if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length)}}
function addSub(id,afterId){const t=D.tasks.find(x=>x.id===id);if(!t)return;const n={id:uid(),text:'',done:false};
  const i=afterId?t.subs.findIndex(x=>x.id===afterId)+1:t.subs.length;t.subs.splice(i,0,n);refreshRow(id);focusSub(id,n.id)}
$('#screen').addEventListener('click',e=>{
  const a=e.target.closest('[data-subadd]');if(a){flushSave();addSub(a.closest('.trow').dataset.id);return}
  const c=e.target.closest('[data-subchk]');if(c){const {id,t,sub}=subCtx(c);if(!sub)return;sub.done=!sub.done;flushSave();if(save())refreshRow(id);
    if(sub.done&&t.subs.every(x=>x.done)&&t.status!=='done')toast('Tüm alt işler bitti. Ana işi tamamlamak için soldaki kutuyu işaretleyin.');return}
  const d=e.target.closest('[data-subdel]');if(d){const {id,t,sub}=subCtx(d);if(!sub)return;t.subs=t.subs.filter(x=>x!==sub);if(save())refreshRow(id)}
},true);
$('#screen').addEventListener('input',e=>{const el=e.target.closest('[data-subtx]');if(!el)return;const {sub}=subCtx(el);if(sub){sub.text=el.value.slice(0,200);saveSoon()}});
$('#screen').addEventListener('keydown',e=>{
  const st=e.target.closest('[data-subtx]');
  if(st){const {id,t,sub}=subCtx(st);if(!sub)return;
    if(e.key==='Enter'&&!e.isComposing){e.preventDefault();flushSave();if(sub.text.trim())addSub(id,sub.id);else st.blur();return}
    if(e.key==='Backspace'&&!st.value){e.preventDefault();const i=t.subs.indexOf(sub);t.subs.splice(i,1);save();refreshRow(id);const prev=t.subs[i-1];if(prev)focusSub(id,prev.id);return}
  }
});
$('#screen').addEventListener('focusout',e=>{const st=e.target.closest('[data-subtx]');if(!st)return;
  setTimeout(()=>{const r=st.closest('.trow');if(!r||!r.isConnected)return;const {id,t,sub}=subCtx(st);
    if(sub&&!sub.text.trim()&&document.activeElement!==st){t.subs=t.subs.filter(x=>x!==sub);save();if(!r.contains(document.activeElement))refreshRow(id);else{const a=document.activeElement;refreshRow(id);}}
    else flushSave()},60)});
$('#screen').addEventListener('keydown',e=>{
  const el=e.target.closest('textarea[data-f=title]');
  if(el&&e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();el.closest('.trow').querySelector('[data-f=descr]').focus()}
});
$('#screen').addEventListener('change',e=>{
  const up=e.target.closest('input[data-tup]');if(up){const id=up.dataset.tup;const t=D.tasks.find(x=>x.id===id);
    if(t&&!t.title.trim()&&!t.descr.trim()){t.title='Başlıksız iş'}flushSave();if(freshId===id)freshId=null;uploadFiles(up,'',id);return}
  const el=e.target.closest('input[data-f=due],input[data-f=follow]');if(!el)return;
  const id=el.closest('.trow').dataset.id,t=D.tasks.find(x=>x.id===id);if(!t)return;
  t[el.dataset.f]=/^\d{4}-\d{2}-\d{2}$/.test(el.value)?el.value:'';if(save())refreshRow(id);
});
$('#screen').addEventListener('focusout',e=>{
  const r=e.target.closest('.trow');if(!r)return;
  setTimeout(()=>{
    if(r.contains(document.activeElement)||modalKind)return;
    flushSave();
    const t=D.tasks.find(x=>x.id===r.dataset.id);
    if(t&&!isEmptyTask(t)&&freshId===t.id)freshId=null;
    drawBadges();
    if(t&&isEmptyTask(t)){D.tasks=D.tasks.filter(x=>x!==t);save();r.remove();if(freshId===t.id)freshId=null;drawBadges();
      if(!$('#tl').children.length)drawRows()}
  },120);
});
$('#screen').addEventListener('click',e=>{
  const c=e.target.closest('[data-chk]');if(c){toggleDone(c.dataset.chk);return}
  const o=e.target.closest('[data-open]');if(o){flushSave();detail(o.dataset.open);return}
  const n=e.target.closest('[data-notes]');if(n){flushSave();notesSheet(n.dataset.notes)}
});
function notesSheet(id,keep){
  const t=D.tasks.find(x=>x.id===id);if(!t)return closeModal(true);
  const items=[...t.notes].sort((a,b)=>(a.at||'').localeCompare(b.at||''));
  openSheet('notes',{color:taskColor(t),head:`<div class="sub">Yapılan işlemler</div><h2>${esc(t.title)||'Başlıksız iş'}</h2>`,
    body:`<div class="box">${items.length?`<ol class="tl">${items.map(n=>`<li><div class="w">${esc(fmtT(n.at))}</div><div class="t">${esc(n.text)}</div></li>`).join('')}</ol>`:'<p class="hint" style="margin:0">Henüz not yok.</p>'}
        <div class="addnote"><textarea class="inp" id="qTxt" placeholder="Yeni işlem notu yazın"></textarea><button class="btn pri" id="qAdd">Ekle</button></div></div>
      <div class="acts"><button class="btn" id="qDet">Tüm ayrıntılar</button><span class="grow"></span><button class="btn dark" data-close>Kapat</button></div>`},keep);
  $('#qAdd').addEventListener('click',()=>{const v=$('#qTxt').value.trim();if(!v){$('#qTxt').focus();return}
    t.notes.push({id:uid(),at:nowS(),text:v});if(save()){notesSheet(id,true);refreshRow(id);toast('Not eklendi')}});
  $('#qDet').addEventListener('click',()=>detail(id));
}
function toggleDone(id){
  const t=D.tasks.find(x=>x.id===id);if(!t)return;
  if(!t.title.trim()){toast('Önce işi yazın.');rowEl(id)?.querySelector('[data-f=title]').focus();return}
  const prev={status:t.status,doneAt:t.doneAt};
  if(t.status==='done'){t.status='open';t.doneAt=''}else{t.status='done';t.doneAt=nowS()}
  if(!save())return;
  if(ctx&&ctx.o.kind==='bugun')keepId=t.status==='done'?id:null;
  const after=()=>{if(modalKind==='detail')detail(id,true);if(rowEl(id))refreshRow(id);else if(route()==='ana')render()};
  after();
  toast(t.status==='done'?'İş tamamlandı':'İş yeniden açıldı',()=>{Object.assign(t,prev);save();after()});
}

/* ================= sayfa (modal) ================= */
let modalKind=null;
function openSheet(kind,{color,head,body,light},keepScroll){
  const sc=$('#modal').scrollTop;
  modalKind=kind;
  const sh=$('#sheet');sh.style.setProperty('--c',color||'');sh.style.setProperty('--hc',color&&!light?'#fff':'');
  sh.innerHTML=`<div class="shead" style="${color?'':'background:var(--card)'}"><button class="x" data-close aria-label="Kapat">×</button>${head}</div><div class="sbody">${body}</div>`;
  $('#modal').classList.remove('hide');document.body.style.overflow='hidden';$('#modal').scrollTop=keepScroll?sc:0;
}
function closeModal(force){
  if(modalKind==='welcome'&&!force)return;
  const was=modalKind;modalKind=null;$('#modal').classList.add('hide');document.body.style.overflow='';
  if(was==='detail'&&!force){flushSave();render()}
}
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal'||e.target.closest('[data-close]'))closeModal()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modalKind)closeModal()});

/* ================= iş ayrıntısı (açılır ekran) ================= */
function detail(id,keep){
  const t=D.tasks.find(x=>x.id===id);if(!t)return closeModal();
  if(freshId===id)freshId=null;
  const color=taskColor(t),d=dueTxt(t);
  const items=[...t.notes.map(n=>({...n,k:'n'})),{k:'s',at:t.created,text:'İş kaydedildi'}]
    .concat(t.status==='done'?[{k:'s',at:t.doneAt,text:'Tamamlandı olarak işaretlendi'}]:[])
    .sort((a,b)=>(a.at||'').localeCompare(b.at||''));
  openSheet('detail',{color,
    head:`<div class="sub">${t.groups.length?t.groups.map(gName).map(esc).join(' · '):'Genel İş'}</div><h2 id="dH">${esc(t.title)||'Başlıksız iş'}</h2>
      <div class="badges" style="margin-top:10px">${d?`<span class="badge ${d.c}">${esc(d.t)}</span>`:''}${isFollow(t)?`<span class="badge p">${diff(t.follow)===0?'Bugün takip et':'Takip günü geçti'}</span>`:''}${t.prio!=='normal'?`<span class="badge r">${t.prio==='acil'?'Acil':'Öncelikli'}</span>`:''}</div>`,
    body:`<div class="box"><label class="lbl" for="dT">İş</label><textarea class="inp" id="dT" rows="1" maxlength="300">${esc(t.title)}</textarea>
        <label class="lbl" for="dD" style="margin-top:14px">Açıklama</label><textarea class="inp" id="dD" rows="2">${esc(t.descr)}</textarea></div>
      <div class="box"><span class="lbl">Alt işler ${t.subs.length?`<span style="font-weight:500">(${t.subs.filter(x=>x.done).length}/${t.subs.length} tamamlandı)</span>`:''}</span>
        ${t.subs.length?`<ul class="subs dsubs">${t.subs.map(x=>`<li class="stask ${x.done?'done':''}" data-dsub="${esc(x.id)}"><button class="subchk" data-dsubchk aria-label="Alt işi tamamla"><span>${ic('check','style="width:12px;height:12px;stroke-width:3.5"')}</span></button><input class="subtx" data-dsubtx maxlength="200" value="${esc(x.text)}"><button class="subdel" data-dsubdel aria-label="Sil">×</button></li>`).join('')}</ul>`:''}
        <div class="addnote" style="align-items:center"><input class="inp" id="dSubNew" maxlength="200" placeholder="Alt iş ekleyin, Enter'a basın"><button class="btn sm dark" id="dSubAdd">Ekle</button></div></div>
      <div class="box"><span class="lbl">Yapılan işlemler</span>
        <ol class="tl">${items.map(n=>`<li class="${n.k==='s'?'sys':''}"><div class="w">${esc(fmtT(n.at))}${n.k==='n'?`<button class="del" data-dn="${esc(n.id)}">sil</button>`:''}</div><div class="t">${esc(n.text)}</div></li>`).join('')}</ol>
        <div class="addnote"><textarea class="inp" id="nTxt" placeholder="İşlem notu yazın (ör. ilgili birime yazı gönderildi)"></textarea><button class="btn pri" id="nAdd">Ekle</button></div></div>
      <div class="box"><span class="lbl">Belgeler</span>
        ${taskFiles(t.id).length?`<ul class="files" style="box-shadow:none;border:1px solid var(--line)">${taskFiles(t.id).map(f=>{const k=ftype(f);return `<li class="file"><button class="fmain" data-fopen="${esc(f.id)}"><span class="ftag" style="--c:${k.c}">${esc(k.k)}</span><span class="grow"><b>${esc(f.name)}</b><small>${esc(fmtT(f.added))} · ${esc(fsize(f.size))}</small></span></button><button class="fmore" data-fmenu="${esc(f.id)}" aria-label="Belge işlemleri">•••</button></li>`}).join('')}</ul>`:'<p class="hint" style="margin:0 0 10px">Bu işe henüz belge eklenmedi.</p>'}
        <label class="btn filebtn" style="margin-top:10px">${ic('clip','style="width:20px;height:20px;vertical-align:-4px"')} Belge ekle<input type="file" multiple id="dUp"></label></div>
      <div class="box"><span class="lbl">Son gün</span><div class="row"><input class="inp" type="date" id="dDue" value="${esc(t.due)}">
          <button type="button" class="chip" data-d="0">Bugün</button><button type="button" class="chip" data-d="1">Yarın</button><button type="button" class="chip" data-d="7">1 hafta</button><button type="button" class="chip" data-d="">Kaldır</button></div>
        <span class="lbl" style="margin-top:14px">Takip tarihi <span style="font-weight:500">(ne zaman soracağınız)</span></span><div class="row"><input class="inp" type="date" id="dFol" value="${esc(t.follow)}">
          <button type="button" class="chip" data-fd="1">Yarın</button><button type="button" class="chip" data-fd="3">3 gün sonra</button><button type="button" class="chip" data-fd="7">1 hafta sonra</button><button type="button" class="chip" data-fd="">Kaldır</button></div>
        <span class="lbl" style="margin-top:14px">Öncelik</span><div class="chips" id="dPrio">${[['normal','Normal'],['yuksek','Öncelikli'],['acil','Acil']].map(([k,l])=>`<button type="button" class="chip ${t.prio===k?'on':''}" data-p="${k}">${l}</button>`).join('')}</div></div>
      <div class="box"><span class="lbl">Grup başkanlıkları</span><div class="chips" id="dG">${D.groups.map(g=>`<button type="button" class="chip ${t.groups.includes(g.id)?'on':''}" data-g="${esc(g.id)}" style="--c:${g.color}"><i class="sw"></i>${esc(g.name)}</button>`).join('')}<button type="button" class="chip ${!t.groups.length?'on':''}" data-g="" style="--c:${GENEL_C}"><i class="sw"></i>Genel İş</button></div>
        <div class="hint">Birden fazla grubu ilgilendiriyorsa diğerlerini de seçin; iş hepsinin sayfasında görünür.</div>
        <span class="lbl" style="margin-top:14px">Sorumlu personel${t.groups.length?' <span style="font-weight:500">('+(t.groups.length>1?'işin gruplarındaki personel':'bu grubun personeli')+')</span>':''}</span><div class="chips" id="dS">${(()=>{
          const ps=D.staff.filter(s=>t.staff.includes(s.id)||!t.groups.length||t.groups.includes(s.group));
          return ps.length?ps.map(s=>`<button type="button" class="chip ${t.staff.includes(s.id)?'on':''}" data-s="${esc(s.id)}" style="--c:${s.group?gColor(s.group):GENEL_C}">${esc(s.name)}</button>`).join('')
            :`<span class="hint" style="margin:0">${D.staff.length?'Bu grupta tanımlı personel yok.':'Henüz personel yok.'} Ayarlar → Personel bölümünden ekleyebilirsiniz.</span>`})()}</div>
        <label class="lbl" for="dR" style="margin-top:14px">Evrak tarih / sayı</label><input class="inp" id="dR" maxlength="200" value="${esc(t.ref)}"></div>
      <div class="acts">
        <button class="btn danger" id="dDel">İşi sil</button><span class="grow"></span><button class="btn pri" data-close>Kaydet ve kapat</button></div>
      <div class="hint" style="text-align:right">Yazdıklarınız kendiliğinden kaydedilir. İşi tamamlamak için listedeki satırın kutusunu işaretleyin.</div>`},keep);
  $('#sheet').querySelectorAll('textarea.inp').forEach(autosize);
  const again=()=>{if(save())detail(id,true)};
  $('#dT').addEventListener('input',e=>{t.title=e.target.value.slice(0,300);$('#dH').textContent=t.title||'Başlıksız iş';autosize(e.target);saveSoon()});
  $('#dD').addEventListener('input',e=>{t.descr=e.target.value.slice(0,4000);autosize(e.target);saveSoon()});
  $('#dR').addEventListener('input',e=>{t.ref=e.target.value.slice(0,200);saveSoon()});
  $('#nTxt').addEventListener('input',e=>autosize(e.target));
  $('#nAdd').addEventListener('click',()=>{const v=$('#nTxt').value.trim();if(!v){$('#nTxt').focus();return}flushSave();t.notes.push({id:uid(),at:nowS(),text:v});again();toast('Not eklendi')});
  $('#sheet').querySelectorAll('[data-dn]').forEach(b=>b.addEventListener('click',()=>{
    if(!b.dataset.sure){b.dataset.sure=1;b.textContent='silinsin mi?';return}
    t.notes=t.notes.filter(n=>n.id!==b.dataset.dn);again()}));
  $('#dUp').addEventListener('change',e=>{flushSave();uploadFiles(e.target,'',id)});
  const dsub=el=>t.subs.find(x=>x.id===el.closest('[data-dsub]').dataset.dsub);
  const addDSub=()=>{const v=$('#dSubNew').value.trim();if(!v)return $('#dSubNew').focus();t.subs.push({id:uid(),text:v.slice(0,200),done:false});flushSave();again();setTimeout(()=>$('#dSubNew')?.focus(),30)};
  $('#dSubAdd').addEventListener('click',addDSub);

const NOTE_C='#0f766e';
let idbP=null,fileOK=true;
function idb(){
  if(!idbP)idbP=Promise.race([new Promise((_,rej)=>setTimeout(()=>rej(new Error('zaman aşımı')),3000)),new Promise((res,rej)=>{
    try{const r=indexedDB.open('daire-is-takip-dosyalar',1);
      r.onupgradeneeded=()=>r.result.createObjectStore('files');
      r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);}catch(e){rej(e)}
  })]);
  return idbP;
}
function idbDo(mode,fn){return idb().then(db=>new Promise((res,rej)=>{
  const tx=db.transaction('files',mode);const st=tx.objectStore('files');let out;
  const r=fn(st);if(r)r.onsuccess=()=>{out=r.result};
  tx.oncomplete=()=>res(out);tx.onerror=()=>rej(tx.error);tx.onabort=()=>rej(tx.error||new Error('iptal'));
}))}
const idbPut=(id,v)=>idbDo('readwrite',st=>st.put(v,id));
const idbGet=id=>idbDo('readonly',st=>st.get(id));
const idbDel=id=>idbDo('readwrite',st=>st.delete(id));
const idbClear=()=>idbDo('readwrite',st=>st.clear());
const memFiles=new Map();let useMem=false;
async function fput(id,v){if(!useMem){try{await idbPut(id,v);return}catch(e){useMem=true;fileOK=false}}memFiles.set(id,v)}
async function fget(id){if(memFiles.has(id))return memFiles.get(id);if(useMem)return undefined;try{return await idbGet(id)}catch(e){return undefined}}
async function fdel(id){memFiles.delete(id);if(!useMem){try{await idbDel(id)}catch(e){}}}
async function fclear(){memFiles.clear();if(!useMem){try{await idbClear()}catch(e){useMem=true;fileOK=false}}}

const F=id=>D.folders.find(f=>f.id===id);
const subFolders=pid=>D.folders.filter(f=>f.parent===pid).sort((a,b)=>a.name.localeCompare(b.name,'tr'));
const filesIn=fid=>noteFiles().filter(f=>f.folder===fid).sort((a,b)=>b.added.localeCompare(a.added));
function deepIds(fid){const out=[fid];subFolders(fid).forEach(s=>out.push(...deepIds(s.id)));return out}
function deepCount(fid){const ids=deepIds(fid);return noteFiles().filter(f=>ids.includes(f.folder)).length}
function folderPath(fid){const p=[];let f=F(fid);while(f){p.unshift(f);f=F(f.parent)}return p}
const fsize=n=>n<1024?n+' B':n<1048576?Math.round(n/1024)+' KB':(n/1048576).toFixed(1).replace('.',',')+' MB';
function ftype(f){
  const n=tlow(f.name),t=f.type||'';
  if(t.includes('pdf')||n.endsWith('.pdf'))return{k:'PDF',c:'#dc2626'};
  if(/\.(docx?|odt|rtf)$/.test(n)||t.includes('word'))return{k:'WORD',c:'#2563eb'};
  if(/\.(xlsx?|ods|csv)$/.test(n)||t.includes('sheet')||t.includes('excel'))return{k:'EXCEL',c:'#16a34a'};
  if(/\.(pptx?|odp)$/.test(n)||t.includes('presentation'))return{k:'SUNUM',c:'#ea580c'};
  if(t.startsWith('image/'))return{k:'GÖRSEL',c:'#7c3aed'};
  return{k:(n.split('.').pop()||'DOSYA').slice(0,5).toLocaleUpperCase('tr'),c:'#64748b'};
}
